<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>简历排版器</title>
  <style>
/* styles/app.css */
/* App UI — Apple minimal style */

*,
*::before,
*::after {
  box-sizing: border-box;
}

[hidden] {
  display: none !important;
}

:root {
  --bg: #f2ede8;
  --toolbar-bg: rgba(255,252,248,0.92);
  --toolbar-border: rgba(60,45,30,0.1);
  --text-primary: #2c2420;
  --text-secondary: #7a6f68;
  --text-tertiary: #b5aca5;
  --accent: #4a3f38;
  --accent-hover: #2c2420;
  --accent-light: #ede8e3;
  --danger: #c0392b;
  --success: #27ae60;
  --warning: #d68910;
  --surface: #fffcf8;
  --surface-secondary: #f5f0eb;
  --border: rgba(60,45,30,0.09);
  --border-strong: rgba(60,45,30,0.16);
  --shadow-sm: 0 1px 3px rgba(40,28,20,0.06), 0 1px 2px rgba(40,28,20,0.04);
  --shadow-md: 0 4px 20px rgba(40,28,20,0.09), 0 1px 4px rgba(40,28,20,0.05);
  --radius-sm: 6px;
  --radius-md: 10px;
  --radius-lg: 14px;
}

html,
body {
  margin: 0;
  padding: 0;
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "SF Pro Text",
    "Helvetica Neue",
    "PingFang SC",
    "Hiragino Sans GB",
    "Microsoft YaHei",
    sans-serif;
  font-size: 13px;
  color: var(--text-primary);
  background: var(--bg);
  -webkit-font-smoothing: antialiased;
}

/* ========================
   App grid
   ======================== */

#app {
  display: grid;
  grid-template-rows: 64px auto 1fr;
  grid-template-columns: 1fr 230px;
  grid-template-areas:
    "toolbar toolbar"
    "privacy privacy"
    "workspace panel";
  min-height: 100vh;
}

/* ========================
   Toolbar
   ======================== */

#toolbar {
  grid-area: toolbar;
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 7px 20px;
  background: var(--toolbar-bg);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border-bottom: 1px solid var(--toolbar-border);
  flex-wrap: nowrap;
  overflow: visible;
  position: sticky;
  top: 0;
  z-index: 100;
}

.toolbar-group {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 0;
  flex-shrink: 0;
}

.toolbar-history-group {
  padding-right: 4px;
}

.toolbar-add-section {
  border: 1px solid var(--border-strong);
  background: var(--surface);
  font-weight: 550;
}

.toolbar-btn {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 5px 10px;
  border: none;
  border-radius: var(--radius-sm);
  background: transparent;
  color: var(--text-primary);
  font-size: 12.5px;
  font-weight: 450;
  cursor: pointer;
  white-space: nowrap;
  transition: background 0.1s;
  letter-spacing: -0.01em;
}

.toolbar-btn:hover {
  background: rgba(0,0,0,0.055);
}

.toolbar-btn:active {
  background: rgba(0,0,0,0.09);
}

.toolbar-btn:disabled {
  opacity: 0.35;
  cursor: not-allowed;
}

.toolbar-btn-primary {
  background: var(--accent);
  color: #fff;
}

.toolbar-btn-primary:hover {
  background: var(--accent-hover);
}

.toolbar-btn-active {
  background: var(--accent) !important;
  color: #fff !important;
}

.toolbar-btn-active:hover {
  background: var(--accent-hover) !important;
}

.toolbar-btn-warn {
  background: rgba(255,149,0,0.12) !important;
  color: #b05a00 !important;
}

.toolbar-btn-warn:hover {
  background: rgba(255,149,0,0.2) !important;
}

.toolbar-btn-dirty {
  box-shadow: 0 0 0 2px rgba(74,63,56,0.4);
}

.btn-icon {
  font-size: 13px;
  line-height: 1;
}

.toolbar-range {
  width: 76px;
  accent-color: var(--accent);
  cursor: pointer;
}

.toolbar-label {
  font-size: 11.5px;
  color: var(--text-secondary);
  white-space: nowrap;
  user-select: none;
}

.toolbar-spacer {
  flex: 1 1 48px;
  min-width: 24px;
}

.toolbar-info {
  display: flex;
  flex-direction: column;
  align-items: flex-end;
  justify-content: center;
  gap: 2px;
  max-width: 170px;
  font-size: 10.5px;
  color: var(--text-secondary);
  flex-shrink: 0;
}

.toolbar-info .info-item {
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  max-width: 170px;
}

.toolbar-status-line {
  display: flex;
  gap: 8px;
}

.toolbar-menu {
  position: relative;
}

.toolbar-menu > summary {
  list-style: none;
}

.toolbar-menu > summary::-webkit-details-marker {
  display: none;
}

.toolbar-select {
  min-width: 78px;
  justify-content: space-between;
  border: 1px solid var(--border-strong);
  background: var(--surface);
}

.toolbar-caret {
  color: var(--text-tertiary);
  font-size: 12px;
}

.toolbar-popover {
  position: absolute;
  top: calc(100% + 8px);
  z-index: 300;
  padding: 6px;
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  background: var(--surface);
  box-shadow: var(--shadow-md);
}

.toolbar-action-options {
  left: 0;
  width: 190px;
}

.toolbar-action-options .toolbar-btn {
  width: 100%;
  justify-content: flex-start;
  padding: 7px 9px;
}

.toolbar-menu-section + .toolbar-menu-section {
  margin-top: 5px;
  padding-top: 5px;
  border-top: 1px solid var(--border);
}

.toolbar-menu-secondary .toolbar-btn {
  color: var(--text-secondary);
  font-size: 11.5px;
}

.toolbar-prompt-options {
  width: 220px;
}

.toolbar-menu-heading {
  padding: 5px 8px 3px;
  color: var(--text-tertiary);
  font-size: 10px;
  font-weight: 600;
}

.toolbar-menu-heading:not(:first-child) {
  margin-top: 5px;
  padding-top: 8px;
  border-top: 1px solid var(--border);
}

.toolbar-prompt-actions {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 3px;
}

.toolbar-prompt-actions .toolbar-btn {
  justify-content: center;
}

.toolbar-theme-options {
  left: 0;
  display: grid;
  grid-template-columns: repeat(2, 72px);
  gap: 3px;
}

.toolbar-theme-options .toolbar-btn {
  justify-content: center;
}

.toolbar-typesetting {
  gap: 10px;
  padding-left: 4px;
}

.toolbar-global-controls {
  display: flex;
  gap: 10px;
}

.toolbar-control {
  display: flex;
  flex-direction: column;
  gap: 2px;
  color: var(--text-secondary);
  font-size: 10.5px;
  white-space: nowrap;
}

.toolbar-control output {
  color: var(--text-primary);
  font-variant-numeric: tabular-nums;
}

.selection-format-controls {
  display: flex;
  align-items: center;
  gap: 3px;
  padding-left: 10px;
  border-left: 1px solid var(--toolbar-border);
}

.toolbar-icon-btn {
  width: 28px;
  height: 28px;
  padding: 0;
  border: 1px solid var(--border-strong);
  border-radius: var(--radius-sm);
  background: var(--surface);
  color: var(--text-primary);
  font-size: 11px;
  line-height: 1;
  cursor: pointer;
}

.toolbar-icon-italic { font-style: italic; }
.toolbar-icon-btn:hover:not(:disabled) { border-color: var(--accent); background: var(--accent-light); }
.toolbar-icon-btn:disabled { opacity: 0.35; cursor: default; }

.selection-bullet-control {
  display: flex;
  align-items: center;
  height: 28px;
  padding: 0 5px;
  border: 1px solid var(--border-strong);
  border-radius: var(--radius-sm);
  background: var(--surface);
}

.selection-bullet-control:has(select:disabled) { opacity: 0.35; }
.toolbar-bullet-select {
  width: 78px;
  border: 0;
  outline: 0;
  background: transparent;
  color: var(--text-primary);
  font-size: 11px;
  cursor: pointer;
}
.toolbar-bullet-select:disabled { cursor: default; }

.toolbar-photo-group {
  padding-left: 12px;
  border-left: 1px solid var(--toolbar-border);
}

.toolbar-photo-actions {
  display: flex;
  flex-direction: column;
  gap: 2px;
}

.toolbar-compact-btn {
  min-width: 44px;
  justify-content: center;
  padding: 3px 8px;
  font-size: 10.5px;
}

.photo-controls {
  align-items: center;
  gap: 4px;
}

.photo-controls:not([hidden]) {
  display: flex;
}

.photo-controls .toolbar-range {
  width: 54px;
}

.toolbar-primary-actions {
  padding-left: 12px;
  border-left: 1px solid var(--toolbar-border);
}

.info-item {
  white-space: nowrap;
}

@media (max-width: 1350px) {
  #toolbar {
    gap: 7px;
    padding-inline: 12px;
  }

  .toolbar-info {
    display: none;
  }
}

/* ========================
   Privacy notice
   ======================== */

#privacy-notice {
  grid-area: privacy;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  min-height: 34px;
  padding: 7px 20px;
  border-bottom: 1px solid rgba(49, 105, 81, 0.18);
  background: #edf5f0;
  color: #355446;
  font-size: 12px;
  line-height: 1.45;
  text-align: center;
}

#privacy-notice strong {
  color: #234537;
  font-weight: 650;
  white-space: nowrap;
}

@media (max-width: 720px) {
  #privacy-notice {
    align-items: flex-start;
    flex-direction: column;
    gap: 2px;
    padding-inline: 14px;
    text-align: left;
  }
}

/* ========================
   Workspace
   ======================== */

#workspace {
  grid-area: workspace;
  display: flex;
  justify-content: center;
  align-items: flex-start;
  gap: 0;
  padding: 32px 24px;
  overflow-y: auto;
}

/* ========================
   Add gutter — LEFT of resume-page
   ======================== */

#add-gutter {
  position: relative;
  width: 40px;
  flex-shrink: 0;
  align-self: stretch;
}

.gutter-item {
  position: absolute;
  right: 0;
  display: flex;
  align-items: center;
  flex-direction: row-reverse;
  transform: translateY(-50%);
}

.gutter-guide {
  width: 14px;
  height: 1px;
  background: var(--border-strong);
  flex-shrink: 0;
}

.gutter-add-btn {
  width: 18px;
  height: 18px;
  border-radius: 50%;
  border: 1px solid var(--border-strong);
  background: var(--surface);
  color: var(--text-tertiary);
  font-size: 13px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 0;
  box-shadow: var(--shadow-sm);
  transition: all 0.12s;
  flex-shrink: 0;
}

.gutter-add-btn:hover {
  background: var(--accent);
  border-color: var(--accent);
  color: #fff;
  box-shadow: 0 2px 8px rgba(0,113,227,0.3);
}

.gutter-item-small .gutter-guide {
  width: 8px;
}

.gutter-add-btn-small {
  width: 14px;
  height: 14px;
  font-size: 10px;
}

/* ========================
   Right panel — resume list
   ======================== */

#resume-list-panel {
  grid-area: panel;
  background: var(--surface);
  border-left: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  overflow: visible;
}

.panel-header {
  position: relative;
  z-index: 200;
  display: flex;
  align-items: center;
  gap: 4px;
  padding: 10px 12px 8px;
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}

.panel-dir-name {
  flex: 1;
  font-size: 12px;
  font-weight: 600;
  color: var(--text-primary);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  letter-spacing: -0.01em;
}

.panel-icon-btn {
  background: none;
  border: none;
  cursor: pointer;
  padding: 3px 5px;
  font-size: 14px;
  border-radius: var(--radius-sm);
  line-height: 1;
  color: var(--text-secondary);
  flex-shrink: 0;
  transition: background 0.1s;
}

.panel-icon-btn:hover {
  background: var(--surface-secondary);
}

.panel-import-menu {
  flex-shrink: 0;
}

.panel-import-btn {
  min-height: 24px;
  padding: 3px 5px;
  border: 1px solid var(--border-strong);
  background: var(--surface);
  font-size: 11px;
}

.panel-import-menu .toolbar-action-options {
  right: 0;
  left: auto;
  text-align: left;
}

.panel-import-status {
  margin: 8px 12px 2px;
  padding: 7px 9px;
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  background: var(--surface-secondary);
  color: var(--text-secondary);
  font-size: 11px;
  line-height: 1.45;
}

.panel-import-status[data-level="success"] {
  border-color: rgba(52, 199, 89, 0.35);
  color: #248a3d;
}

.panel-import-status[data-level="error"] {
  border-color: rgba(255, 59, 48, 0.35);
  color: var(--danger);
}

#resume-list {
  list-style: none;
  padding: 6px 0;
  margin: 0;
  overflow-y: auto;
  flex: 1;
  min-height: 0;
}

.resume-list-item {
  padding: 7px 14px;
  font-size: 12px;
  color: var(--text-primary);
  cursor: pointer;
  border-left: 2.5px solid transparent;
  line-height: 1.45;
  word-break: break-all;
  transition: background 0.1s;
  letter-spacing: -0.01em;
}

.resume-list-item:hover {
  background: var(--surface-secondary);
}

.resume-list-item.active {
  border-left-color: var(--accent);
  background: var(--accent-light);
  color: var(--accent);
  font-weight: 600;
}

.resume-list-item.pinned:not(.active) {
  border-left-color: rgba(74, 63, 56, 0.28);
}

.resume-list-heading {
  padding: 9px 12px 4px;
  color: var(--text-tertiary);
  font-size: 10px;
  font-weight: 600;
  text-transform: uppercase;
}

.resume-list-snapshot,
.resume-list-source {
  display: flex;
  align-items: center;
  gap: 4px;
}

.resume-list-snapshot > span,
.resume-list-source > span {
  flex: 1;
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
}

.resume-list-action {
  width: 20px;
  height: 20px;
  padding: 0;
  border: 0;
  border-radius: var(--radius-sm);
  background: transparent;
  color: var(--text-tertiary);
  font-size: 15px;
  line-height: 20px;
  cursor: pointer;
  opacity: 0;
}

.resume-list-item:hover .resume-list-action,
.resume-list-action:focus-visible,
.resume-list-pin.active {
  opacity: 1;
}

.resume-list-pin {
  font-size: 14px;
}

.resume-list-pin:hover,
.resume-list-pin.active {
  background: rgba(180, 132, 45, 0.12);
  color: #9a6b18;
}

.resume-list-rename:hover {
  background: var(--accent-light);
  color: var(--accent);
}

.resume-list-delete:hover {
  background: rgba(192,57,43,0.1);
  color: var(--danger);
}

#panel-empty {
  padding: 24px 12px;
  font-size: 12px;
  color: var(--text-tertiary);
  text-align: center;
  line-height: 1.7;
}

#panel-empty.hidden {
  display: none;
}

/* ========================
   Status region
   ======================== */

#status-region {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  padding: 3px 16px;
  background: rgba(29,29,31,0.85);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  color: rgba(255,255,255,0.7);
  font-size: 11px;
  text-align: center;
  letter-spacing: 0.01em;
}

/* ========================
   Dialog
   ======================== */

#dialog-root {
  position: fixed;
  inset: 0;
  z-index: 1000;
  display: none;
}

#dialog-root.active {
  display: flex;
  align-items: center;
  justify-content: center;
}

.dialog-backdrop {
  position: absolute;
  inset: 0;
  background: rgba(0,0,0,0.28);
}

.dialog-box {
  position: relative;
  background: var(--surface);
  border-radius: var(--radius-lg);
  padding: 24px 24px 20px;
  max-width: 400px;
  width: 90%;
  box-shadow: 0 20px 60px rgba(0,0,0,0.18), 0 4px 16px rgba(0,0,0,0.08);
}

.dialog-title {
  font-size: 15px;
  font-weight: 600;
  margin: 0 0 8px;
  letter-spacing: -0.02em;
  color: var(--text-primary);
}

.dialog-message {
  font-size: 13px;
  color: var(--text-secondary);
  margin: 0 0 20px;
  line-height: 1.55;
}

.dialog-actions {
  display: flex;
  justify-content: flex-end;
  gap: 8px;
}

.dialog-btn {
  padding: 7px 16px;
  border-radius: var(--radius-sm);
  border: none;
  font-size: 13px;
  font-weight: 500;
  cursor: pointer;
  background: var(--surface-secondary);
  color: var(--text-primary);
  transition: background 0.1s;
  letter-spacing: -0.01em;
}

.dialog-btn:hover {
  background: #e8e8ed;
}

.dialog-btn:disabled {
  cursor: not-allowed;
  opacity: 0.42;
}

.dialog-btn:disabled:hover {
  background: var(--surface-secondary);
}

.dialog-btn-primary {
  background: var(--accent);
  color: #fff;
}

.dialog-btn-primary:hover {
  background: var(--accent-hover);
}

.dialog-btn-danger {
  background: var(--danger);
  color: #fff;
}

.dialog-btn-danger:hover {
  background: #e5352a;
}

.dialog-btn-leading { margin-right: auto; }

.dialog-field {
  display: block;
  margin: 14px 0 0;
}

.dialog-field-label {
  display: block;
  margin-bottom: 6px;
  color: var(--text-secondary);
  font-size: 12px;
  font-weight: 500;
}

.dialog-field .dialog-input { margin-bottom: 0; }

.dialog-field-error {
  margin: 8px 0 0;
  color: var(--danger);
  font-size: 12px;
  line-height: 1.45;
}

.dialog-field-error + .dialog-actions { margin-top: 20px; }

.dialog-input {
  width: 100%;
  padding: 8px 12px;
  border: 1px solid var(--border-strong);
  border-radius: var(--radius-sm);
  font-size: 13px;
  margin-bottom: 16px;
  background: var(--surface-secondary);
  color: var(--text-primary);
  transition: border-color 0.15s, box-shadow 0.15s;
}

.dialog-input:focus {
  outline: none;
  border-color: var(--accent);
  box-shadow: 0 0 0 3px rgba(0,113,227,0.18);
  background: #fff;
}

/* ========================
   Toast
   ======================== */

.toast-container {
  position: fixed;
  top: 60px;
  right: 16px;
  z-index: 2000;
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.toast {
  padding: 10px 16px;
  border-radius: var(--radius-md);
  font-size: 12.5px;
  color: #fff;
  box-shadow: var(--shadow-md);
  animation: toast-in 0.18s ease-out;
  max-width: 320px;
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  font-weight: 450;
}

.toast-info    { background: rgba(29,29,31,0.88); }
.toast-success { background: rgba(52,199,89,0.92); }
.toast-warning { background: rgba(255,149,0,0.92); }
.toast-error   { background: rgba(255,59,48,0.92); }

@keyframes toast-in {
  from { opacity: 0; transform: translateY(-6px) scale(0.97); }
  to   { opacity: 1; transform: translateY(0) scale(1); }
}

/* styles/resume.css */
/* A4 resume page styles */
/* Supports two themes: style-a (arrow bullets) and style-b (董佳晨 style) */

/* Use Times New Roman only for Latin text and numbers, while each theme keeps its Chinese font. */
@font-face {
  font-family: "Resume Latin";
  src: local("Times New Roman"), local("TimesNewRomanPSMT");
  font-style: normal;
  font-weight: 400;
  unicode-range: U+0020-007E, U+00A0-024F, U+2010-201F;
}
@font-face {
  font-family: "Resume Latin";
  src: local("Times New Roman Bold"), local("TimesNewRomanPS-BoldMT");
  font-style: normal;
  font-weight: 600 900;
  unicode-range: U+0020-007E, U+00A0-024F, U+2010-201F;
}
@font-face {
  font-family: "Resume Latin";
  src: local("Times New Roman Italic"), local("TimesNewRomanPS-ItalicMT");
  font-style: italic;
  font-weight: 400;
  unicode-range: U+0020-007E, U+00A0-024F, U+2010-201F;
}
@font-face {
  font-family: "Resume Latin";
  src: local("Times New Roman Bold Italic"), local("TimesNewRomanPS-BoldItalicMT");
  font-style: italic;
  font-weight: 600 900;
  unicode-range: U+0020-007E, U+00A0-024F, U+2010-201F;
}

/* ========================
   Section spacing handles
   ======================== */

.spacing-handle {
  position: relative;
  height: 0;
  display: flex;
  align-items: center;
  margin: 0;
  z-index: 10;
  outline: none;
  pointer-events: none;
}
.spacing-handle-line {
  width: 100%;
  height: 1px;
  background: transparent;
  transition: background 0.15s;
}
.spacing-handle.dragging .spacing-handle-line {
  background: repeating-linear-gradient(90deg, #93c5fd 0 5px, transparent 5px 9px);
}
.spacing-handle.snapped .spacing-handle-line { background: #2563eb; }
.spacing-calibration {
  position: absolute;
  left: -14px;
  top: 50%;
  width: 9px;
  height: max(12px, calc(var(--spacing-size, 0mm) + 12px));
  border-left: 1px solid #94a3b8;
  background: repeating-linear-gradient(to bottom, #94a3b8 0 1px, transparent 1px 4px) right top / 6px 100% no-repeat;
  opacity: 0;
  pointer-events: none;
}

  opacity: 1;
}
.spacing-tooltip {
  position: absolute; left: 2px; top: 50%; transform: translateY(-50%);
  background: #1f2937; color: #fff; font-size: 10px;
  padding: 2px 6px; border-radius: 3px; white-space: nowrap;
  pointer-events: none; opacity: 0; transition: opacity 0.15s;

.resume-section {
  position: relative;
}
.resume-section::after {
  content: "";
  position: absolute;
  inset: -4px -6px;
  border: 1px solid transparent;
  border-radius: 3px;
  pointer-events: none;
  transition: border-color 0.12s, background-color 0.12s;
  z-index: 15;
}

}

  border-color: #2563eb;
  background: rgba(219, 234, 254, 0.12);
}
.section-reorder-handle {
  position: absolute;
  left: -28px;
  top: -4px;
  display: grid;
  place-items: center;
  width: 20px;
  height: 20px;
  padding: 0;
  border: 1px solid #93c5fd;
  border-radius: 4px;
  background: #fff;
  color: #2563eb;
  font: 13px/1 system-ui, sans-serif;
  cursor: grab;
  touch-action: none;
  opacity: 0;
  transition: opacity 0.12s, background-color 0.12s;
  z-index: 20;
}
.resume-section:hover .section-reorder-handle,
.section-reorder-handle:focus-visible,
.section-reorder-handle.dragging {
  opacity: 1;

.section-reorder-handle:hover,
.section-reorder-handle:focus-visible,
.section-reorder-handle.dragging {
  background: #eff6ff;

}
.section-reorder-handle.dragging { cursor: grabbing; }

  background: rgba(239, 246, 255, 0.45);

// js/utils.js
/**
 * Unique ID generation with fallback for environments without crypto.randomUUID().
 * @returns {string}
 */
function generateId() {
  try {
    return crypto.randomUUID();
  } catch {
    return `${Date.now().toString(36)}-${Math.random().toString(36).slice(2, 10)}`;
  }
}

/**
 * Deep clone an object using structuredClone if available.
 * @template T
 * @param {T} obj
 * @returns {T}
 */
function deepClone(obj) {
  if (typeof structuredClone === "function") {
    return structuredClone(obj);
  }
  return JSON.parse(JSON.stringify(obj));
}

/**
 * Escape HTML special characters to prevent XSS.
 * @param {string} str
 * @returns {string}
 */
function escapeHtml(str) {
  return str
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;");
}

/**
 * Safe JSON serialization that escapes characters that could break
 * when embedded in HTML <script> tags.
 * @param {*} data
 * @returns {string}
 */
function safeJsonSerialize(data) {
  return JSON.stringify(data)
    .replace(/</g, "\\u003c")
    .replace(/>/g, "\\u003e")
    .replace(/&/g, "\\u0026")
    .replace(/\u2028/g, "\\u2028")
    .replace(/\u2029/g, "\\u2029");
}

/**
 * Safely parse JSON embedded in HTML, handling common corruption.
 * @param {string} jsonStr
 * @returns {object|null}
 */
function safeJsonParse(jsonStr) {
  try {
    return JSON.parse(jsonStr);
  } catch (e) {
    console.error("Failed to parse embedded state:", e);
    return null;
  }
}

/**
 * Clean a filename string for safe file system use.
 * @param {string} name
 * @returns {string}
 */
function sanitizeFileName(name) {
  return name
    .trim()
    .replace(/[<>:"/\\|?*]+/g, "-")
    .replace(/\s+/g, "-")
    .replace(/-+/g, "-")
    .replace(/^-|-$/g, "")
    || "resume";
}

/**
 * Convert pixels to millimeters.
 * @param {number} px
 * @returns {number}
 */
function pxToMm(px) {
  return px * 0.264583;
}

/**
 * @param {string} message
 * @param {string} level - 'info' | 'success' | 'warning' | 'error'
 */
function showToast(message, level) {
  let container = document.querySelector(".toast-container");
  if (!container) {
    container = document.createElement("div");
    container.className = "toast-container";
    document.body.appendChild(container);
  }

  const toast = document.createElement("div");
  toast.className = `toast toast-${level}`;
  toast.textContent = message;
  container.appendChild(toast);

  setTimeout(() => {
    toast.remove();
    if (container.children.length === 0) {
      container.remove();
    }
  }, 3000);
}

/**

 * The Resume State is the single source of truth for all resume data.

/** @type {string} */
const STATE_STORAGE_PREFIX = "resume-formatter:draft:";

/** @type {string} */

/** @type {number} */
const APP_VERSION = "1.1.0";

/** @type {number} */
const SCHEMA_VERSION_1 = 2;

/** @type {string} */
const SECTION_TITLES = {
  education: "教育背景",
  experience: "实习经历",
  projects: "项目经历",
  skills: "技能特长",
};

/**
 * Object.frozen mapping from PRD section keys to display titles.
 * A read‑only lookup.
 */
const SECTION_TITLES_MAP = Object.freeze(Object.assign(
  Object.create(null),
  SECTION_TITLES,
));

/**
 * SECTION_TITLES_MAP 的防御性访问
 * 若 sectionType 未注册则回退到原始英文键
 * @param {string} sectionType
 * @returns {string}
 */
function getSectionTitle(sectionType) {
  return SECTION_TITLES_MAP[sectionType] || sectionType;
}

function applyEntryOrder(section, orderedIds) {
  if (!section || !Array.isArray(section.entries) || !Array.isArray(orderedIds)) return false;
  if (section.entries.length !== orderedIds.length) return false;
  const byId = new Map(section.entries.map((entry) => [entry.id, entry]));
  const reordered = orderedIds.map((id) => byId.get(id));
  if (reordered.some((entry) => !entry)) return false;
  const changed = reordered.some((entry, index) => entry !== section.entries[index]);
  if (changed) section.entries = reordered;
  return changed;
}

function applySectionOrder(state, orderedIds) {
  if (!state || !Array.isArray(state.sections) || !Array.isArray(orderedIds)) return false;
  if (state.sections.length !== orderedIds.length) return false;
  const byId = new Map(state.sections.map((section) => [section.id, section]));
  const reordered = orderedIds.map((id) => byId.get(id));
  if (reordered.some((section) => !section)) return false;
  const changed = reordered.some((section, index) => section !== state.sections[index]);
  if (changed) state.sections = reordered;
  return changed;
}

function touchState(state) {

 * Create an import snapshot from the current state's content-relevant data.
 * @param {object} state
 * @returns {object}
 */
function createImportSnapshot(state) {
  return {
    resumeName: state.resumeName,
    profile: deepClone(state.profile),
    sections: deepClone(state.sections),
  };
}

/**
 * Restore content from an import snapshot (preserves photo).
 * @param {object} state
 * @param {object} snapshot
 */
function restoreImportSnapshot(state, snapshot) {
  if (!snapshot) return;
  state.resumeName = snapshot.resumeName;
  state.profile = deepClone(snapshot.profile);
  state.sections = deepClone(snapshot.sections);
  state.metadata.updatedAt = new Date().toISOString();
}

/**
 * Get the localStorage key for a given draft.
 * @param {string} documentId
 * @returns {string}
 */
function getDraftKey(documentId) {
  return STATE_STORAGE_PREFIX + documentId;
}

/**
 * Save current state to localStorage draft.
 * @param {object} state
 */
function saveDraft(state) {
  try {
    const key = getDraftKey(state.documentId);
    localStorage.setItem(key, JSON.stringify(state));
    localStorage.setItem(LAST_DOCUMENT_KEY, state.documentId);
    return true;
  } catch (e) {
    console.error("Failed to save draft:", e);
    return false;
  }
}

/**
 * Load draft from localStorage.
 * @param {string} documentId
 * @returns {object|null}
 */
function loadDraft(documentId) {
  try {
    const key = getDraftKey(documentId);
    const raw = localStorage.getItem(key);
    if (!raw) return null;
    return JSON.parse(raw);
  } catch (e) {
    console.error("Failed to load draft:", e);
    return null;
  }
}

/**
 * Load embedded state from HTML's <script id="embedded-resume-state">.
 * @returns {object|null}
 */
function loadEmbeddedState() {
  const el = document.getElementById("embedded-resume-state");
  if (!el) return null;
  return safeJsonParse(el.textContent);
}

// js/parser.js
/**
 * Markdown Parser module.
 * Parses Schema v1 Markdown into intermediate parse result.
 * Does NOT do validation — that's validator's job.
 */

/** @type {string[]} */
const SUPPORTED_SECTIONS = ["education", "experience", "projects", "skills"];

/** @type {Record<string, string>} */
const SECTION_ALIASES = {
  "教育经历": "education",
  "教育背景": "education",
  "实习经历": "experience",
  "工作经历": "experience",
  "项目经历": "projects",
  "技能": "skills",
  "技能特长": "skills",
};

/**
 * @typedef {object} ParseResult
 * @property {object} frontmatter - Parsed YAML frontmatter key-value pairs
 * @property {object[]} sections - Parsed sections
  - line numbers reserved for error reporting
 */

/**
 * Parse a raw Markdown string into a structured result.
 * @param {string} raw
 * @returns {ParseResult}
 */
function parseMarkdown(raw) {
  const lines = raw.replace(/\r\n/g, "\n").replace(/\r/g, "\n").split("\n");

  let lineIndex = 0;
  const errors = [];

  // Parse frontmatter
  const frontmatter = parseFrontmatter(lines, lineIndex, errors);
  // Advance past frontmatter
  lineIndex = frontmatter._endLine + 1;

  // Parse body sections
  const sections = parseSections(lines, lineIndex, errors);

  return {
    frontmatter,
    sections,
    errors,
  };
}

/**
 * Parse YAML frontmatter delimited by --- lines.
 * Only supports single-line key: value pairs.
 * Handles URLs by splitting only on first colon.
 * @param {string[]} lines
 * @param {number} startLine
 * @param {object[]} errors
 * @returns {object}
 */
function parseFrontmatter(lines, startLine, errors) {
  const result = { _startLine: startLine, _endLine: startLine };
  let i = startLine;

  // First line must be ---
  if (lines[i]?.trim() !== "---") {
    errors.push({
      level: "error",
      code: "MISSING_FRONTMATTER",
      message: "文件缺少 Frontmatter（以 --- 开头）。",
      line: i + 1,
    });
    result._endLine = i;
    return result;
  }
  i++;

  // Parse key: value pairs until closing ---
  while (i < lines.length) {
    const line = lines[i];
    if (line.trim() === "---") {
      result._endLine = i;
      return result;
    }

    if (line.trim() === "") {
      i++;
      continue;
    }

    const colonIndex = line.indexOf(":");
    if (colonIndex === -1) {
      errors.push({
        level: "warning",
        code: "INVALID_FRONTMATTER_LINE",
        message: `Frontmatter 第 ${i + 1} 行无法解析：${line}`,
        line: i + 1,
        suggestion: "Frontmatter 只支持 `key: value` 格式。",
      });
      i++;
      continue;
    }

    const key = line.slice(0, colonIndex).trim();
    const value = line.slice(colonIndex + 1).trim();

    if (key in result) {
      errors.push({
        level: "error",
        code: "DUPLICATE_FIELD",
        field: key,
        message: `Frontmatter 字段 "${key}" 重复。`,
        line: i + 1,
        suggestion: "请删除重复字段。",
      });
    } else {
      result[key] = value;
    }

    i++;
  }

  // Reached end without closing ---
  errors.push({
    level: "error",
    code: "UNCLOSED_FRONTMATTER",
    message: "Frontmatter 缺少结束标记 ---。",
    line: lines.length,
    suggestion: "请在 Frontmatter 末尾添加 ---。",
  });
  result._endLine = Math.min(i, lines.length - 1);
  return result;
}

/**
 * Parse body sections from Markdown lines.
 * @param {string[]} lines
 * @param {number} startLine
 * @param {object[]} errors
 * @returns {object[]}
 */
function parseSections(lines, startLine, errors) {
  const sections = [];
  let currentSection = null;
  let currentEntry = null;
  let currentBullets = null;
  let currentListBlock = null;

  for (let i = startLine; i < lines.length; i++) {
    const line = lines[i];
    const trimmed = line.trim();

    // Empty line
    if (trimmed === "") continue;

    // ## section
    if (trimmed.startsWith("## ") || trimmed === "##") {
      const rawName = trimmed.slice(2).trim();
      const alias = SECTION_ALIASES[rawName] || rawName;
      const name = SUPPORTED_SECTIONS.includes(alias) ? alias : "custom";
      if (name && !name.startsWith("#")) {
        currentSection = {
          type: name,
          ...(name === "custom" ? { title: rawName, blocks: [] } : {}),
          line: i + 1,
          entries: [],
        };
        currentEntry = null;
        currentBullets = null;
        currentListBlock = null;
        sections.push(currentSection);

        // skills has no ### entries — use one synthetic entry
        if (name === "skills") {
          currentEntry = { name: "", role: "", date: "", location: "", bullets: [], line: i + 1 };
          currentSection.entries.push(currentEntry);
          currentBullets = currentEntry.bullets;
        }
        continue;
      }
    }

    // Optional custom display title, placed directly below a section heading.
    if (trimmed.startsWith("title:") && currentSection && (!currentEntry
      || (currentSection.type === "skills" && currentEntry.bullets.length === 0))) {
      currentSection.title = trimmed.slice("title:".length).trim();
      continue;
    }

    // ### entry
    if (trimmed.startsWith("### ") || trimmed === "###") {
      if (!currentSection) {
        errors.push({
          level: "warning",
          code: "ENTRY_OUTSIDE_SECTION",
          message: `条目 "${trimmed}" 不在任何栏目内。`,
          line: i + 1,
        });
        continue;
      }
      if (currentSection.type === "skills") {
        errors.push({
          level: "warning",
          code: "ENTRY_IN_SKILLS",
          message: "skills 栏目不支持子条目（###）。",
          line: i + 1,
          suggestion: "skills 栏目请直接使用 - bullet。",
        });
        continue;
      }
      const name = trimmed.slice(3).trim();
      currentEntry = { name, role: "", date: "", location: "", bullets: [], line: i + 1 };
      if (currentSection.type === "custom") {
        currentEntry.type = "entry";
        currentEntry.id = "";
        currentSection.blocks.push(currentEntry);
      } else {
        currentSection.entries.push(currentEntry);
      }
      currentBullets = currentEntry.bullets;
      currentListBlock = null;
      continue;
    }

    // role: / date: / location: fields
    if (trimmed.startsWith("role:") || trimmed.startsWith("date:") || trimmed.startsWith("location:")) {
      if (!currentEntry) {
        errors.push({
          level: "warning",
          code: "FIELD_OUTSIDE_ENTRY",
          message: `字段 "${trimmed.split(":")[0]}" 不在任何条目内。`,
          line: i + 1,
        });
        continue;
      }
      const colonIndex = trimmed.indexOf(":");
      const key = trimmed.slice(0, colonIndex).trim();
      const value = trimmed.slice(colonIndex + 1).trim();

      if (currentEntry[key] !== "") {
        errors.push({
          level: "error",
          code: "DUPLICATE_ENTRY_FIELD",
          field: key,
          entry: currentEntry.name,
          message: `${currentSection.type} 栏目下"${currentEntry.name}"的 ${key} 字段重复。`,
          line: i + 1,
          suggestion: "请删除重复字段。",
        });
      } else {
        currentEntry[key] = value;
      }
      continue;
    }

    // - bullet
    if (trimmed.startsWith("- ")) {
      if (currentSection?.type === "custom" && !currentBullets) {
        if (!currentListBlock) {
          currentListBlock = { type: "list", bullets: [], line: i + 1 };
          currentSection.blocks.push(currentListBlock);
        }
        currentBullets = currentListBlock.bullets;
      }
      if (!currentBullets) {
        errors.push({
          level: "warning",
          code: "BULLET_OUTSIDE_ENTRY",
          message: `Bullet 不在任何条目内。`,
          line: i + 1,
        });
        continue;
      }
      const content = trimmed.slice(2);
      if (content.trim() === "") {
        errors.push({
          level: "warning",
          code: "EMPTY_BULLET",
          message: "存在空 Bullet。",
          line: i + 1,
        });
      }
      currentBullets.push({
        line: i + 1,
        raw: content,
        content: parseBoldTokens(content, i, errors),
      });
      continue;
    }

    // Free-form paragraph in a custom section.
    if (currentSection?.type === "custom") {
      currentSection.blocks.push({
        type: "text",
        line: i + 1,
        content: parseBoldTokens(trimmed, i, errors),
      });
      currentEntry = null;
      currentBullets = null;
      currentListBlock = null;
      continue;
    }

    // Unsupported markup
    if (/^\s*#{1,4}\s/.test(trimmed)) {
      errors.push({
        level: "error",
        code: "UNSUPPORTED_HEADING",
        message: `不支持的标题层级（第 ${i + 1} 行）。`,
        line: i + 1,
        suggestion: "请使用 ## 定义栏目、### 定义条目。",
      });
      continue;
    }

    if (/^>\s/.test(trimmed)) {
      errors.push({
        level: "warning",
        code: "UNSUPPORTED_BLOCKQUOTE",
        message: `不支持引用块（第 ${i + 1} 行）。`,
        line: i + 1,
      });
      continue;
    }

    if (/\|.*\|/.test(trimmed)) {
      errors.push({
        level: "warning",
        code: "UNSUPPORTED_TABLE",
        message: `不支持表格（第 ${i + 1} 行）。`,
        line: i + 1,
      });
      continue;
    }
  }

  return sections;
}

/**
 * Parse supported inline emphasis: **bold**, *italic*, and ***both***.
 * @param {string} text
 * @param {number} line
 * @param {object[]} errors
 * @returns {object[]}
 */
function parseBoldTokens(text, line, errors) {
  const tokens = [];
  let remaining = text;

  while (remaining.length > 0) {
    const openIdx = remaining.indexOf("*");
    if (openIdx === -1) {
      if (remaining) {
        tokens.push({ type: "text", value: remaining });
      }
      break;
    }

    if (openIdx > 0) {
      tokens.push({ type: "text", value: remaining.slice(0, openIdx) });
    }

    const marker = remaining.startsWith("***", openIdx)
      ? "***"
      : remaining.startsWith("**", openIdx) ? "**" : "*";
    const afterOpen = remaining.slice(openIdx + marker.length);
    const closeIdx = afterOpen.indexOf(marker);

    if (closeIdx === -1) {
      errors.push({
        level: "warning",
        code: "UNCLOSED_EMPHASIS",
        message: `格式标记 ${marker} 未闭合（第 ${line + 1} 行）。`,
        line: line + 1,
      });
      tokens.push({ type: "text", value: remaining.slice(openIdx) });
      break;
    }

    const value = afterOpen.slice(0, closeIdx);
    if (value) {
      tokens.push({
        type: marker === "*" ? "text" : "strong",
        value,
        ...(marker === "*" || marker === "***" ? { italic: true } : {}),
      });
    }

    remaining = afterOpen.slice(closeIdx + marker.length);
  }

  return parseMarkdownLinkTokens(tokens);
}

function parseMarkdownLinkTokens(tokens) {
  const result = [];
  const linkPattern = /\[([^\]]+)\]\(((?:https?:\/\/|mailto:)[^)\s]+)\)/gi;

  for (const token of tokens) {
    if (token.href) {
      result.push(token);
      continue;
    }
    let cursor = 0;
    let match;
    linkPattern.lastIndex = 0;
    while ((match = linkPattern.exec(token.value || ""))) {
      if (match.index > cursor) {
        result.push({ ...token, value: token.value.slice(cursor, match.index) });
      }
      result.push({ ...token, value: match[1], href: match[2] });
      cursor = match.index + match[0].length;
    }
    if (cursor < (token.value || "").length) {
      result.push({ ...token, value: token.value.slice(cursor) });
    }
  }

  return result;
}

/**
 * JSON Importer module.
 * Imports a JSON-format resume into a Resume State.
 * Output state is identical to Markdown importer output.
 */

/** @type {string[]} */
const ALLOWED_SECTION_TYPES = ["education", "experience", "projects", "skills", "custom"];

/**
 * Strip code fences (```json ... ```) from raw input.
 * @param {string} raw
 * @returns {string}
 */
function stripCodeFences(raw) {
  const trimmed = raw.trim();
  const fenceMatch = trimmed.match(/^```(?:json)?\s*\n?([\s\S]*?)\n?```$/);
  if (fenceMatch) {
    return fenceMatch[1].trim();
  }
  return raw;
}

/**
 * Convert JSON.parse error to human-readable message with line number.
 * @param {string} raw
 * @param {SyntaxError} err
 * @returns {string}
 */
function describeJsonError(raw, err) {
  const message = err && err.message ? err.message : "未知错误";

  // V8 format: "... at position N"
  const posMatch = message.match(/position\s+(\d+)/i);
  if (posMatch) {
    const pos = parseInt(posMatch[1], 10);
    const before = raw.slice(0, pos);
    const line = before.split("\n").length;
    const lastNl = before.lastIndexOf("\n");
    const col = lastNl === -1 ? pos + 1 : pos - lastNl;
    return `JSON 语法错误（第 ${line} 行，第 ${col} 列）：${message}。请检查该位置的括号、引号和逗号是否正确。`;
  }

  // SpiderMonkey format: "... at line X column Y"
  const lineMatch = message.match(/line\s+(\d+)\s+column\s+(\d+)/i);
  if (lineMatch) {
    const line = parseInt(lineMatch[1], 10);
    const col = parseInt(lineMatch[2], 10);
    return `JSON 语法错误（第 ${line} 行，第 ${col} 列）：${message}。请检查该位置的括号、引号和逗号是否正确。`;
  }

  return `JSON 语法错误：${message}。`;
}
