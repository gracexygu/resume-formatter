/**
 * Build a fix prompt for AI based on errors.
 * @param {object[]} errors
 * @param {string} rawJson
 * @param {boolean} includeJson
 * @returns {string}
 */
function buildFixPrompt(errors, rawJson, includeJson) {
  const errorList = errors
    .filter((e) => e.level === "error" || e.level === "warning")
    .map((e, i) => `${i + 1}. [${e.level === "error" ? "错误" : "警告"}] ${e.message}`)
    .join("\n");

  let prompt = `以下 JSON 简历在导入时出现了错误，请修复并返回完整的修正后 JSON。

错误列表：
${errorList}`;

  if (includeJson && rawJson) {
    prompt += `\n\n原始 JSON：\n\`\`\`json\n${rawJson}\n\`\`\``;
  }

  prompt += `\n\n修复要求：
1. 返回修正后的完整 JSON，不要包含 \`\`\`json 代码块标记或额外文本。
2. 修复所有错误和警告。
3. 保持原有数据不变，只修正格式和缺失字段。
4. schemaVersion 必须为 2。
5. sections 可以使用预置类型，也可以使用带 title 和 blocks 的 custom 类型。
6. bullets 必须是字符串数组，可以包含 **加粗** 标记。
7. profile 必须包含 name、headline、phone、email。`;

  return prompt;
}

/**
 * Import a JSON-format resume.
 * @param {string} rawJson - Raw JSON string (may include code fences)
 * @param {string} fileName - Original file name or label
 * @returns {{ errors: object[], state: object|null }}
 */
function importJsonResume(rawJson, fileName) {
  const errors = [];
  const cleaned = stripCodeFences(rawJson);

  // 1. Syntax validation
  let data;
  try {
    data = JSON.parse(cleaned);
  } catch (err) {
    errors.push({
      level: "error",
      code: "JSON_SYNTAX_ERROR",
      message: describeJsonError(cleaned, err),
      suggestion: "请使用 JSON 校验工具检查格式。",
    });
    return { errors, state: null };
  }

  // Root must be an object
  if (!data || typeof data !== "object" || Array.isArray(data)) {
    errors.push({
      level: "error",
      code: "INVALID_ROOT",
      message: "JSON 根节点必须为对象。",
      suggestion: "请确保 JSON 顶层为 { ... } 对象格式。",
    });
    return { errors, state: null };
  }

  // 2. Schema validation
  // 2a. schemaVersion
  if (data.schemaVersion === undefined || data.schemaVersion === null) {
    errors.push({
      level: "error",
      code: "MISSING_SCHEMA_VERSION",
      field: "schemaVersion",
      message: "缺少必填字段：schemaVersion。",
      suggestion: "请添加 \"schemaVersion\": 2。",
    });
  } else if (![1, 2].includes(data.schemaVersion)) {
    errors.push({
      level: "error",
      code: "UNSUPPORTED_SCHEMA_VERSION",
      field: "schemaVersion",
      message: `不支持的 schemaVersion：${data.schemaVersion}，当前支持版本 1 和 2。`,
      suggestion: "请将 schemaVersion 修改为 2。",
    });
  }

  // 2b. resumeName
  if (!data.resumeName || typeof data.resumeName !== "string") {
    errors.push({
      level: "error",
      code: "MISSING_REQUIRED_FIELD",
      field: "resumeName",
      message: "缺少必填字段：resumeName。",
      suggestion: "请添加 \"resumeName\": \"简历名称\"。",
    });
  }

  // 2c. profile
  if (!data.profile || typeof data.profile !== "object" || Array.isArray(data.profile)) {
    errors.push({
      level: "error",
      code: "MISSING_REQUIRED_FIELD",
      field: "profile",
      message: "缺少必填字段：profile（必须为对象）。",
      suggestion: "请添加 \"profile\": { ... }。",
    });
  } else {
    const requiredProfileFields = ["name", "headline", "phone", "email"];
    for (const field of requiredProfileFields) {
      if (!data.profile[field] || typeof data.profile[field] !== "string") {
        errors.push({
          level: "error",
          code: "MISSING_PROFILE_FIELD",
          field: "profile." + field,
          message: `profile 缺少必填字段：${field}。`,
          suggestion: `请添加 \"${field}\": \"值\"。`,
        });
      }
    }
  }

  // 2d. sections
  if (!Array.isArray(data.sections)) {
    errors.push({
      level: "error",
      code: "MISSING_REQUIRED_FIELD",
      field: "sections",
      message: "缺少必填字段：sections（必须为数组）。",
      suggestion: "请添加 \"sections\": [ ... ]。",
    });
  } else {
    const sectionTypesSeen = new Set();

    for (let i = 0; i < data.sections.length; i++) {
      const section = data.sections[i];
      const sectionLabel = "sections[" + i + "]";

      if (!section || typeof section !== "object" || Array.isArray(section)) {
        errors.push({
          level: "error",
          code: "INVALID_SECTION",
          message: sectionLabel + " 必须为对象。",
          suggestion: "请确保每个 section 是一个对象。",
        });
        continue;
      }

      if (!section.type || typeof section.type !== "string") {
        errors.push({
          level: "error",
          code: "MISSING_SECTION_TYPE",
          message: sectionLabel + " 缺少 type 字段。",
          suggestion: "请添加 \"type\": \"education\" 等字段。",
        });
        continue;
      }

      if (!ALLOWED_SECTION_TYPES.includes(section.type)) {
        errors.push({
          level: "error",
          code: "UNKNOWN_SECTION",
          section: section.type,
          message: `未知栏目类型：${section.type}。支持：${ALLOWED_SECTION_TYPES.join("、")}。`,
          suggestion: "请使用已支持的栏目类型。",
        });
        continue;
      }

      if (section.type !== "custom" && sectionTypesSeen.has(section.type)) {
        errors.push({
          level: "warning",
          code: "DUPLICATE_SECTION",
          section: section.type,
          message: `栏目 "${section.type}" 重复。`,
          suggestion: "第一个之外的重复栏目将被保留但可能导致排版问题。",
        });
      }
      if (section.type !== "custom") sectionTypesSeen.add(section.type);

      if (section.type === "custom") {
        if (!section.title || typeof section.title !== "string") {
          errors.push({
            level: "error",
            code: "MISSING_SECTION_TITLE",
            section: "custom",
            message: `${sectionLabel} 缺少 title 字段。`,
            suggestion: "请添加 \"title\": \"板块名称\"。",
          });
        }
        if (!Array.isArray(section.blocks)) {
          errors.push({
            level: "error",
            code: "INVALID_BLOCKS",
            section: "custom",
            message: `${sectionLabel} 的 blocks 必须为数组。`,
            suggestion: "请添加 \"blocks\": [ ... ]。",
          });
        } else {
          validateJsonCustomBlocks(section.blocks, sectionLabel, errors);
        }
        continue;
      }

      // Validate entries
      if (!Array.isArray(section.entries)) {
        errors.push({
          level: "error",
          code: "INVALID_ENTRIES",
          section: section.type,
          message: `${sectionLabel}（类型 ${section.type}）的 entries 必须为数组。`,
          suggestion: "请添加 \"entries\": [ ... ]。",
        });
        continue;
      }

      for (let j = 0; j < section.entries.length; j++) {
        const entry = section.entries[j];
        const entryLabel = sectionLabel + ".entries[" + j + "]";
        const entryName = (entry && entry.name) ? entry.name : `第 ${j + 1} 个条目`;

        if (!entry || typeof entry !== "object" || Array.isArray(entry)) {
          errors.push({
            level: "error",
            code: "INVALID_ENTRY",
            section: section.type,
            message: entryLabel + " 必须为对象。",
            suggestion: "请确保每个 entry 是一个对象。",
          });
          continue;
        }

        // Non-skills entries need name
        if (section.type !== "skills" && (!entry.name || typeof entry.name !== "string")) {
          errors.push({
            level: "error",
            code: "MISSING_ENTRY_NAME",
            section: section.type,
            message: `${section.type} 栏目下存在未命名的条目（${entryLabel}）。`,
            suggestion: "请添加 \"name\": \"名称\"。",
          });
        }

        // education/experience need role and date
        if (section.type === "education" || section.type === "experience") {
          if (!entry.role || typeof entry.role !== "string") {
            errors.push({
              level: "error",
              code: "MISSING_ROLE",
              section: section.type,
              entry: entryName,
              message: `${section.type} 栏目下"${entryName}"缺少 role 字段。`,
              suggestion: "请添加 \"role\": \"角色\"。",
            });
          }
          if (!entry.date || typeof entry.date !== "string") {
            errors.push({
              level: "error",
              code: "MISSING_DATE",
              section: section.type,
              entry: entryName,
              message: `${section.type} 栏目下"${entryName}"缺少 date 字段。`,
              suggestion: "请添加 \"date\": \"时间范围\"。",
            });
          }
        }

        // projects: warn for missing role/date
        if (section.type === "projects") {
          if (!entry.role || typeof entry.role !== "string") {
            errors.push({
              level: "warning",
              code: "MISSING_PROJECT_ROLE",
              section: "projects",
              entry: entryName,
              message: `projects 栏目下"${entryName}"缺少 role 字段。`,
              suggestion: "建议添加 role 指明项目角色。",
            });
          }
          if (!entry.date || typeof entry.date !== "string") {
            errors.push({
              level: "warning",
              code: "MISSING_PROJECT_DATE",
              section: "projects",
              entry: entryName,
              message: `projects 栏目下"${entryName}"缺少 date 字段。`,
              suggestion: "建议添加 date 指明项目时间。",
            });
          }
        }

        // Validate bullets
        if (entry.bullets !== undefined && entry.bullets !== null) {
          if (!Array.isArray(entry.bullets)) {
            errors.push({
              level: "error",
              code: "INVALID_BULLETS",
              section: section.type,
              entry: entryName,
              message: `${section.type} 栏目下"${entryName}"的 bullets 必须为字符串数组。`,
              suggestion: "请使用 \"bullets\": [\"描述1\", \"描述2\"] 格式。",
            });
          } else {
            for (let k = 0; k < entry.bullets.length; k++) {
              if (typeof entry.bullets[k] !== "string") {
                errors.push({
                  level: "error",
                  code: "INVALID_BULLET",
                  section: section.type,
                  entry: entryName,
                  message: `${section.type} 栏目下"${entryName}"的 bullets[${k}] 必须为字符串。`,
                  suggestion: "请确保每个 bullet 是字符串。",
                });
              }
            }
          }
        }
      }
    }
  }

  // Check for error-level issues
  const hasErrors = errors.some((e) => e.level === "error");
  if (hasErrors) {
    return { errors, state: null };
  }

  // Build state
  const state = buildStateFromJson(data, fileName);

  // Generate info summary
  const summaryItems = [];
  const eduCount = data.sections.find((s) => s.type === "education")?.entries?.length || 0;
  const expCount = data.sections.find((s) => s.type === "experience")?.entries?.length || 0;
  const projCount = data.sections.find((s) => s.type === "projects")?.entries?.length || 0;
  const skillSection = data.sections.find((s) => s.type === "skills");
  const skillCount = skillSection?.entries?.[0]?.bullets?.length || 0;
  const customCount = data.sections.filter((section) => section.type === "custom").length;

  if (eduCount > 0) summaryItems.push(`${eduCount} 条教育经历`);
  if (expCount > 0) summaryItems.push(`${expCount} 条工作经历`);
  if (projCount > 0) summaryItems.push(`${projCount} 个项目`);
  if (skillCount > 0) summaryItems.push(`${skillCount} 条技能`);
  if (customCount > 0) summaryItems.push(`${customCount} 个自定义栏目`);

  const errorCount = errors.filter((e) => e.level === "error").length;
  const warningCount = errors.filter((e) => e.level === "warning").length;

  errors.push({
    level: "info",
    code: "IMPORT_SUMMARY",
    message: `已导入（JSON）：${fileName}。识别到：${summaryItems.join("、") || "无内容"}。存在：${errorCount} 个错误、${warningCount} 个警告。`,
  });

  return { errors, state };
}

/**
 * Build a Resume State from parsed JSON data.
 * Output structure is identical to validator.js buildState().
 * @param {object} data - Parsed JSON data
 * @param {string} fileName
 * @returns {object}
 */
function buildStateFromJson(data, fileName) {
  const now = new Date().toISOString();
  const state = createDefaultState();

  state.documentId = generateId();
  state.resumeName = data.resumeName || "";
  state.source.fileName = fileName;
  state.source.importedAt = now;
  state.source.sourceType = "json";
  state.schemaVersion = data.schemaVersion || 1;

  const profile = data.profile || {};
  state.profile.name = profile.name || "";
  state.profile.headline = profile.headline || "";
  state.profile.location = profile.location || "";
  state.profile.phone = profile.phone || "";
  state.profile.email = profile.email || "";
  state.profile.website = profile.website || "";
  state.profile.portfolio = profile.portfolio || "";
  state.profile.github = profile.github || "";

  state.sections = (data.sections || []).map((section) => ({
    id: generateId(),
    type: section.type,
    title: section.title || getSectionTitle(section.type),
    blocks: (section.blocks || []).map((block) => buildJsonCustomBlock(block)),
    entries: (section.entries || []).map((entry) => ({
      id: generateId(),
      name: entry.name || "",
      role: entry.role || "",
      date: entry.date || "",
      location: entry.location || "",
      bullets: (entry.bullets || []).map((b) => ({
        id: generateId(),
        content: parseBoldTokens(typeof b === "string" ? b : "", 0, []),
      })),
    })),
  }));

  touchState(state);
  state.importSnapshot = createImportSnapshot(state);

  return state;
}

function validateJsonCustomBlocks(blocks, sectionLabel, errors) {
  blocks.forEach((block, index) => {
    const label = `${sectionLabel}.blocks[${index}]`;
    if (!block || typeof block !== "object" || !["text", "list", "entry"].includes(block.type)) {
      errors.push({
        level: "error",
        code: "INVALID_BLOCK",
        section: "custom",
        message: `${label} 必须是 text、list 或 entry 内容块。`,
      });
      return;
    }
    if (block.type === "text" && typeof block.content !== "string") {
      errors.push({ level: "error", code: "INVALID_BLOCK_CONTENT", section: "custom", message: `${label}.content 必须是字符串。` });
    }
    if (block.type === "list" && (!Array.isArray(block.items) || block.items.some((item) => typeof item !== "string"))) {
      errors.push({ level: "error", code: "INVALID_BLOCK_ITEMS", section: "custom", message: `${label}.items 必须是字符串数组。` });
    }
    if (block.type === "entry" && typeof block.name !== "string") {
      errors.push({ level: "error", code: "INVALID_BLOCK_ENTRY", section: "custom", message: `${label}.name 必须是字符串。` });
    }
    if (block.type === "entry" && block.bullets !== undefined
      && (!Array.isArray(block.bullets) || block.bullets.some((item) => typeof item !== "string"))) {
      errors.push({ level: "error", code: "INVALID_BLOCK_BULLETS", section: "custom", message: `${label}.bullets 必须是字符串数组。` });
    }
  });
}

function buildJsonCustomBlock(block) {
  if (block.type === "text") {
    return { id: generateId(), type: "text", content: parseBoldTokens(block.content || "", 0, []) };
  }
  if (block.type === "list") {
    return {
      id: generateId(),
      type: "list",
      bullets: (block.items || []).map((item) => ({
        id: generateId(),
        content: parseBoldTokens(item, 0, []),
      })),
    };
  }
  return {
    id: generateId(),
    type: "entry",
    name: block.name || "",
    role: block.role || "",
    date: block.date || "",
    location: block.location || "",
    bullets: (block.bullets || []).map((item) => ({
      id: generateId(),
      content: parseBoldTokens(item, 0, []),
    })),
  };
}

// js/validator.js
/**
 * Validator module.
 * Validates supported Markdown schemas and builds a Resume State.
 */

/** @type {string[]} */
const REQUIRED_FRONTMATTER_FIELDS = [
  "schema_version",
  "resume_name",
  "name",
  "phone",
  "email",
];

/** @type {string[]} */
const OPTIONAL_FRONTMATTER_FIELDS = [
  "headline",
  "location",
  "website",
  "portfolio",
  "github",
  "photo",
  "resume_formatter_state",
];

const FORMATTER_STATE_FIELD = "resume_formatter_state";

/**
 * @typedef {object} ValidationResult
 * @property {object[]} errors - Validation errors/warnings/infos
 * @property {object|null} state - Generated Resume State, null if fatal errors
 */

/**
 * Validate a parsed Markdown result and produce a Resume State.
 * @param {object} parseResult - Output from parseMarkdown()
 * @param {string} fileName - Original Markdown file name
 * @returns {ValidationResult}
 */
function validateAndBuildState(parseResult, fileName) {
  const errors = [...(parseResult.errors || [])];
  const frontmatter = parseResult.frontmatter || {};
  const sections = parseResult.sections || [];

  // 1. Validate schema_version
  const schemaVersion = parseInt(frontmatter.schema_version, 10);
  if (!frontmatter.schema_version || frontmatter.schema_version === "") {
    errors.push({
      level: "error",
      code: "MISSING_SCHEMA_VERSION",
      message: "缺少 schema_version 字段。",
      line: frontmatter._startLine + 1,
      suggestion: "请在 Frontmatter 中添加 schema_version: 1。",
    });
  } else if (![1, 2].includes(schemaVersion)) {
    errors.push({
      level: "error",
      code: "UNSUPPORTED_SCHEMA_VERSION",
      message: `不支持的 schema_version：${frontmatter.schema_version}，当前支持版本 1 和 2。`,
      line: frontmatter._startLine + 1,
      suggestion: "请将 schema_version 修改为 2。",
    });
  }

  // 2. Validate required frontmatter fields
  for (const field of REQUIRED_FRONTMATTER_FIELDS) {
    if (!frontmatter[field] || frontmatter[field] === "") {
      errors.push({
        level: "error",
        code: "MISSING_REQUIRED_FIELD",
        field,
        message: `缺少必填字段：${field}。`,
        line: frontmatter._startLine + 1,
        suggestion: `请在 Frontmatter 中添加 ${field}。`,
      });
    }
  }

  // 3. Validate sections
  let sectionTypesSeen = new Set();
  for (const section of sections) {
    if (section.type !== "custom" && sectionTypesSeen.has(section.type)) {
      errors.push({
        level: "warning",
        code: "DUPLICATE_SECTION",
        section: section.type,
        message: `栏目 "${section.type}" 重复。`,
        line: section.line,
        suggestion: "第一个之外的重复栏目将被保留但可能导致排版问题。",
      });
    }
    if (section.type !== "custom") sectionTypesSeen.add(section.type);

    if (section.type === "custom") {
      if (!section.title) {
        errors.push({
          level: "error",
          code: "MISSING_SECTION_TITLE",
          message: "自定义栏目缺少标题。",
          line: section.line,
          suggestion: "请使用 ## 栏目名称。",
        });
      }
      continue;
    }

    for (const entry of (section.entries || [])) {
      // Validate entry fields
      if (section.type !== "skills" && !entry.name) {
        errors.push({
          level: "error",
          code: "MISSING_ENTRY_NAME",
          section: section.type,
          message: `${section.type} 栏目下存在未命名的条目。`,
          line: entry.line,
          suggestion: "请为条目添加名称（### 名称）。",
        });
      }

      if (["education", "experience"].includes(section.type)) {
        if (!entry.role) {
          errors.push({
            level: "error",
            code: "MISSING_ROLE",
            section: section.type,
            entry: entry.name,
            message: `${section.type} 栏目下"${entry.name}"缺少 role 字段。`,
            line: entry.line,
            suggestion: `请在该条目中增加 role: 信息。`,
          });
        }
        if (!entry.date) {
          errors.push({
            level: "error",
            code: "MISSING_DATE",
            section: section.type,
            entry: entry.name,
            message: `${section.type} 栏目下"${entry.name}"缺少 date 字段。`,
            line: entry.line,
            suggestion: `请在该条目中增加 date: 时间范围。`,
          });
        }
      }

      if (section.type === "projects") {
        if (!entry.role) {
          errors.push({
            level: "warning",
            code: "MISSING_PROJECT_ROLE",
            section: "projects",
            entry: entry.name,
            message: `projects 栏目下"${entry.name}"缺少 role 字段。`,
            line: entry.line,
            suggestion: "建议添加 role 指明项目角色。",
          });
        }
        if (!entry.date) {
          errors.push({
            level: "warning",
            code: "MISSING_PROJECT_DATE",
            section: "projects",
            entry: entry.name,
            message: `projects 栏目下"${entry.name}"缺少 date 字段。`,
            line: entry.line,
            suggestion: "建议添加 date 指明项目时间。",
          });
        }
      }

      if (["experience", "projects"].includes(section.type) && entry.bullets.length === 0) {
        errors.push({
          level: "warning",
          code: "NO_BULLETS",
          section: section.type,
          entry: entry.name,
          message: `${section.type} 栏目下"${entry.name}"没有 Bullet。`,
          line: entry.line,
          suggestion: "建议添加至少一条经历描述。",
        });
      }
    }
  }

  // Check for error-level issues
  const hasErrors = errors.some((e) => e.level === "error");

  // Build state (even with errors — the caller decides whether to use it)
  const state = buildState(frontmatter, sections, fileName);
  const formatterState = parseFormatterFileState(frontmatter[FORMATTER_STATE_FIELD]);
  if (frontmatter[FORMATTER_STATE_FIELD] && !formatterState) {
    errors.push({
      level: "warning",
      code: "INVALID_FORMATTER_STATE",
      message: "文件中的排版设置无法识别，已使用默认排版。",
      line: frontmatter._startLine + 1,
    });
  } else if (formatterState) {
    applyFormatterFileState(state, formatterState);
    state.importSnapshot = createImportSnapshot(state);
  }

  // Generate info summary
  const summaryItems = [];
  const eduCount = sections.find((s) => s.type === "education")?.entries?.length || 0;
  const expCount = sections.find((s) => s.type === "experience")?.entries?.length || 0;
  const projCount = sections.find((s) => s.type === "projects")?.entries?.length || 0;
  const skillCount = sections.find((s) => s.type === "skills")?.entries?.[0]?.bullets?.length || 0;
  const customCount = sections.filter((s) => s.type === "custom").length;

  if (eduCount > 0) summaryItems.push(`${eduCount} 条教育经历`);
  if (expCount > 0) summaryItems.push(`${expCount} 条工作经历`);
  if (projCount > 0) summaryItems.push(`${projCount} 个项目`);
  if (skillCount > 0) summaryItems.push(`${skillCount} 条技能`);
  if (customCount > 0) summaryItems.push(`${customCount} 个自定义栏目`);

  const errorCount = errors.filter((e) => e.level === "error").length;
  const warningCount = errors.filter((e) => e.level === "warning").length;

  errors.push({
    level: "info",
    code: "IMPORT_SUMMARY",
    message: `已导入：${fileName}。识别到：${summaryItems.join("、") || "无内容"}。存在：${errorCount} 个错误、${warningCount} 个警告。`,
  });

  return { errors, state: hasErrors ? null : state };
}

function parseFormatterFileState(raw) {
  if (!raw) return null;
  try {
    const parsed = JSON.parse(decodeURIComponent(String(raw)));
    return parsed && parsed.version === 1 ? parsed : null;
  } catch {
    return null;
  }
}

function applyFormatterFileState(state, formatterState) {
  const sectionStates = Array.isArray(formatterState.sections) ? formatterState.sections : [];
  (state.sections || []).forEach((section, sectionIndex) => {
    const savedSection = sectionStates[sectionIndex];
    if (!savedSection || typeof savedSection !== "object") return;
    section.id = restoreFormatterId(savedSection.id, section.id);
    if (Number.isFinite(Number(savedSection.spacingBefore))) {
      section.spacingBefore = Math.max(0, Math.min(100, Number(savedSection.spacingBefore)));
    }
    restoreEntryPresentations(section.entries, savedSection.entries);
    (section.blocks || []).forEach((block, blockIndex) => {
      const savedBlock = Array.isArray(savedSection.blocks) ? savedSection.blocks[blockIndex] : null;
      if (!savedBlock || savedBlock.type !== block.type) return;
      block.id = restoreFormatterId(savedBlock.id, block.id);
      restoreBulletPresentations(block.bullets, savedBlock.bullets);
    });
  });

  const savedLayout = formatterState.layout && typeof formatterState.layout === "object"
    ? formatterState.layout
    : {};
  state.layout.fontSize = restoreNumber(savedLayout.fontSize, state.layout.fontSize, 7, 12);
  state.layout.lineHeight = restoreNumber(savedLayout.lineHeight, state.layout.lineHeight, 1.15, 1.8);
  state.layout.headerOffsetY = restoreNumber(savedLayout.headerOffsetY, state.layout.headerOffsetY, -8, 8);
  state.layout.theme = ["a", "b", "c", "d"].includes(savedLayout.theme) ? savedLayout.theme : "a";
  restoreBlockFormatting(state, savedLayout);

  const savedPhoto = formatterState.photo && typeof formatterState.photo === "object"
    ? formatterState.photo
    : {};
  state.photo.scale = restoreNumber(savedPhoto.scale, state.photo.scale, 0.1, 4);
  state.photo.frameScale = restoreNumber(savedPhoto.frameScale, state.photo.frameScale, 0.4, 2);
  state.photo.frameOffsetX = restoreNumber(savedPhoto.frameOffsetX, state.photo.frameOffsetX, -100, 100);
  state.photo.frameOffsetY = restoreNumber(savedPhoto.frameOffsetY, state.photo.frameOffsetY, -100, 100);
  state.photo.offsetX = restoreNumber(savedPhoto.offsetX, state.photo.offsetX, -10000, 10000);
  state.photo.offsetY = restoreNumber(savedPhoto.offsetY, state.photo.offsetY, -10000, 10000);
}

function restoreEntryPresentations(entries, savedEntries) {
  (entries || []).forEach((entry, index) => {
    const savedEntry = Array.isArray(savedEntries) ? savedEntries[index] : null;
    if (!savedEntry) return;
    entry.id = restoreFormatterId(savedEntry.id, entry.id);
    restoreBulletPresentations(entry.bullets, savedEntry.bullets);
  });
}

function restoreBulletPresentations(bullets, savedBullets) {
  const allowedMarkers = new Set(["none", "disc", "circle", "square", "arrow"]);
  (bullets || []).forEach((bullet, index) => {
    const savedBullet = Array.isArray(savedBullets) ? savedBullets[index] : null;
    if (!savedBullet) return;
    bullet.id = restoreFormatterId(savedBullet.id, bullet.id);
    if (allowedMarkers.has(savedBullet.markerStyle)) bullet.markerStyle = savedBullet.markerStyle;
    if (Array.isArray(savedBullet.fontSizeRanges)) {
      bullet.content = applyFontSizeRanges(bullet.content, savedBullet.fontSizeRanges);
    }
  });
}

function applyFontSizeRanges(tokens, rawRanges) {
  const totalLength = (tokens || []).reduce((sum, token) => sum + String(token.value || "").length, 0);
  const ranges = rawRanges.map((range) => {
    if (!Array.isArray(range) || range.length < 3) return null;
    const start = Math.max(0, Math.min(totalLength, Number(range[0])));
    const end = Math.max(start, Math.min(totalLength, Number(range[1])));
    const delta = Math.max(-2, Math.min(3, Number(range[2])));
    return Number.isFinite(start) && Number.isFinite(end) && Number.isFinite(delta) && end > start
      ? [start, end, delta]
      : null;
  }).filter(Boolean);
  if (ranges.length === 0) return tokens;

  const result = [];
  let tokenStart = 0;
  for (const token of (tokens || [])) {
    const value = String(token.value || "");
    const tokenEnd = tokenStart + value.length;
    const cuts = new Set([tokenStart, tokenEnd]);
    for (const [start, end] of ranges) {
      if (start > tokenStart && start < tokenEnd) cuts.add(start);
      if (end > tokenStart && end < tokenEnd) cuts.add(end);
    }
    const points = [...cuts].sort((a, b) => a - b);
    for (let index = 0; index < points.length - 1; index++) {
      const start = points[index];
      const end = points[index + 1];
      if (end <= start) continue;
      const next = { ...token, value: value.slice(start - tokenStart, end - tokenStart) };
      const range = ranges.find(([rangeStart, rangeEnd]) => start >= rangeStart && end <= rangeEnd);
      if (range) next.fontSizeDelta = range[2];
      else delete next.fontSizeDelta;
      result.push(next);
    }
    tokenStart = tokenEnd;
  }
  return result;
}

function restoreBlockFormatting(state, savedLayout) {
  const allowedKeys = new Set();
  Object.keys(state.profile || {}).forEach((field) => allowedKeys.add(`profile:${field}`));
  for (const section of (state.sections || [])) {
    const entries = [
      ...(section.entries || []),
      ...(section.blocks || []).filter((block) => block.type === "entry"),
    ];
    entries.forEach((entry) => ["name", "role", "date", "location"].forEach((field) => {
      allowedKeys.add(`entry:${entry.id}:${field}`);
    }));
    (section.blocks || []).filter((block) => block.type === "text").forEach((block) => {
      allowedKeys.add(`text:${block.id}:content`);
    });
  }

  const textStyles = {};
  for (const [key, value] of Object.entries(savedLayout.blockTextStyle || {})) {
    if (!allowedKeys.has(key) || !value || typeof value !== "object") continue;
    textStyles[key] = { bold: Boolean(value.bold), italic: Boolean(value.italic) };
  }
  if (Object.keys(textStyles).length > 0) state.layout.blockTextStyle = textStyles;

  const fontSizes = {};
  for (const [key, value] of Object.entries(savedLayout.blockFontSizeDelta || {})) {
    const delta = Number(value);
    if (allowedKeys.has(key) && Number.isFinite(delta)) {
      fontSizes[key] = Math.max(-2, Math.min(3, delta));
    }
  }
  if (Object.keys(fontSizes).length > 0) state.layout.blockFontSizeDelta = fontSizes;
}

function restoreFormatterId(value, fallback) {
  return typeof value === "string" && /^[A-Za-z0-9_-]{1,80}$/.test(value) ? value : fallback;
}

function restoreNumber(value, fallback, min, max) {
  const number = Number(value);
  return Number.isFinite(number) ? Math.max(min, Math.min(max, number)) : fallback;
}

/**
 * Build a Resume State from parsed frontmatter and sections.
 * @param {object} frontmatter
 * @param {object[]} sections
 * @param {string} fileName
 * @returns {object}
 */
function buildState(frontmatter, sections, fileName) {
  const now = new Date().toISOString();
  const state = createDefaultState();

  state.documentId = generateId();
  state.resumeName = frontmatter.resume_name || "";
  state.source.fileName = fileName;
  state.source.importedAt = now;

  state.profile.name = frontmatter.name || "";
  state.profile.headline = frontmatter.headline || "";
  state.profile.location = frontmatter.location || "";
  state.profile.phone = frontmatter.phone || "";
  state.profile.email = frontmatter.email || "";
  state.profile.website = frontmatter.website || "";
  state.profile.portfolio = frontmatter.portfolio || "";
  state.profile.github = frontmatter.github || "";
  state.photo.source = frontmatter.photo || "";

  state.schemaVersion = Number.parseInt(frontmatter.schema_version, 10) || 1;
  state.sections = sections.map((section) => ({
    id: generateId(),
    type: section.type,
    title: section.title || getSectionTitle(section.type),
    blocks: (section.blocks || []).map((block) => buildCustomBlock(block)),
    entries: (section.entries || []).map((entry) => ({
      id: generateId(),
      name: entry.name || "",
      role: entry.role || "",
      date: entry.date || "",
      location: entry.location || "",
      bullets: (entry.bullets || []).map((b) => ({
        id: generateId(),
        content: b.content || [{ type: "text", value: b.raw || "" }],
      })),
    })),
  }));

  touchState(state);
  state.importSnapshot = createImportSnapshot(state);

  return state;
}

function buildCustomBlock(block) {
  if (block.type === "text") {
    return {
      id: generateId(),
      type: "text",
      content: block.content || [{ type: "text", value: "" }],
    };
  }
  if (block.type === "list") {
    return {
      id: generateId(),
      type: "list",
      bullets: (block.bullets || []).map((bullet) => ({
        id: generateId(),
        content: bullet.content || [{ type: "text", value: bullet.raw || "" }],
      })),
    };
  }
  return {
    id: generateId(),
    type: "entry",
    name: block.name || "",
    role: block.role || "",
    date: block.date || "",
    location: block.location || "",
    bullets: (block.bullets || []).map((bullet) => ({
      id: generateId(),
      content: bullet.content || [{ type: "text", value: bullet.raw || "" }],
    })),
  };
}

// js/renderer.js
/**
 * Renderer module.
 * Renders Resume State into DOM. Pure rendering — no mutation of state.
 */

/**
 * Render the full resume page from state.
 * @param {object} state
 */
function renderResume(state) {
  if (typeof applyLayoutState === "function") applyLayoutState(state);
  renderHeader(state);
  renderSections(state);
  if (typeof applyLocalFormatting === "function") applyLocalFormatting(state);
  if (typeof applyHeaderPosition === "function") applyHeaderPosition(state);
  updateStatusInfo(state);
}

/**
 * Get current theme from #resume-page data-theme attribute.
 * @returns {"a"|"b"|"c"|"d"}
 */
function getTheme() {
  const page = document.getElementById("resume-page");
  const t = page && page.dataset.theme;
  return (t === "b" || t === "c" || t === "d") ? t : "a";
}

function getPortfolioContact(value) {
  const raw = String(value || "").trim();
  if (!raw) return null;

  const urlMatch = raw.match(/https?:\/\/[^\s|｜]+/i);
  const href = urlMatch ? urlMatch[0] : "";
  let label = href
    ? raw.slice(0, urlMatch.index).replace(/[\s|｜:：-]+$/g, "").trim()
    : raw;
  if (!label || /^AI\s*作品集$/i.test(label)) label = "AI作品集";

  return { label, href };
}

/**
 * Render header — behaviour differs by theme.
 * @param {object} state
 */
function renderHeader(state) {
  const { profile } = state;

  const nameEl = document.getElementById("profile-name");
  if (nameEl) {
    nameEl.textContent = profile.name;
    nameEl.dataset.empty = profile.name ? "false" : "true";
    nameEl.dataset.profileField = "name";
    nameEl.contentEditable = "plaintext-only";
  }

  const headlineEl = document.getElementById("profile-headline");
  if (headlineEl) {
    headlineEl.textContent = profile.headline || "";
    headlineEl.dataset.empty = profile.headline ? "false" : "true";
    headlineEl.dataset.profileField = "headline";
    headlineEl.contentEditable = "plaintext-only";
  }

  const contactEl = document.getElementById("contact-info");
  if (contactEl) {
    contactEl.innerHTML = "";
    const portfolio = getPortfolioContact(profile.portfolio);
    const items = [
      profile.phone && {
        field: "phone",
        text: profile.phone,
      },
      profile.email && {
        field: "email",
        text: profile.email,
      },
      portfolio && { field: "portfolio", text: portfolio.label, href: portfolio.href },
    ].filter(Boolean);

    items.forEach(({ field, text, href }) => {
      const item = document.createElement(href ? "a" : "span");
      item.className = `contact-item${href ? " contact-link" : ""}`;
      item.textContent = text;
      item.dataset.profileField = field;
      item.contentEditable = "plaintext-only";
      if (href) {
        item.href = href;
        item.target = "_blank";
        item.rel = "noopener noreferrer";
      }
      contactEl.appendChild(item);
    });
  }

  renderPhoto(state);
}

/**
 * Render all sections with spacing handles between them.
 * @param {object} state
 */
function renderSections(state) {
  const container = document.getElementById("resume-sections");
  if (!container) return;
  container.innerHTML = "";

  state.sections.forEach((section) => {
    const handle = document.createElement("div");
    handle.className = "spacing-handle no-print";
    handle.dataset.sectionId = section.id;
    const line = document.createElement("div");
    line.className = "spacing-handle-line";
    const calibration = document.createElement("div");
    calibration.className = "spacing-calibration";
    const tip = document.createElement("span");
    tip.className = "spacing-tooltip";
    const currentMm = (section.spacingBefore !== undefined) ? section.spacingBefore : 0;
    tip.textContent = currentMm.toFixed(1) + " mm";
    handle.style.setProperty("--spacing-size", currentMm + "mm");
    handle.setAttribute("aria-valuenow", String(currentMm));
    handle.setAttribute("aria-valuetext", `${currentMm.toFixed(1)} 毫米`);
    handle.appendChild(line);
    handle.appendChild(calibration);
    handle.appendChild(tip);
    container.appendChild(handle);

    const sectionEl = renderSection(section);
    if (section.spacingBefore !== undefined) {
      sectionEl.style.marginTop = section.spacingBefore + "mm";
    }
    container.appendChild(sectionEl);
  });

  // Update side gutter after layout settles
  requestAnimationFrame(() => updateAddGutter(state));
}

/**
 * Render a single section.
 * @param {object} section
 * @returns {HTMLElement}
 */
function renderSection(section) {
  const sectionEl = document.createElement("section");
  sectionEl.className = "resume-section";
  sectionEl.dataset.sectionId = section.id;
  sectionEl.dataset.sectionType = section.type;

  const reorderHandle = document.createElement("button");
  reorderHandle.className = "section-reorder-handle no-print";
  reorderHandle.type = "button";
  reorderHandle.dataset.sectionId = section.id;
  reorderHandle.textContent = "↕";
  reorderHandle.title = `拖动调整${section.title}的全局顺序`;
  reorderHandle.setAttribute("aria-label", `调整${section.title}的全局顺序`);
  reorderHandle.setAttribute("aria-keyshortcuts", "ArrowUp ArrowDown");
  sectionEl.appendChild(reorderHandle);

  const titleEl = document.createElement("h2");
  titleEl.className = "section-title";
  titleEl.textContent = section.title;
  titleEl.contentEditable = "plaintext-only";
  titleEl.dataset.sectionId = section.id;
  titleEl.dataset.empty = section.title ? "false" : "true";
  titleEl.setAttribute("aria-label", "编辑栏目标题");
  sectionEl.appendChild(titleEl);

  if (section.type === "custom") {
    const deleteSectionButton = document.createElement("button");
    deleteSectionButton.className = "btn-del-section no-print";
    deleteSectionButton.type = "button";
    deleteSectionButton.textContent = "×";
    deleteSectionButton.title = "删除该板块";
    deleteSectionButton.setAttribute("aria-label", `删除${section.title || "该板块"}`);
    deleteSectionButton.dataset.sectionId = section.id;
    sectionEl.appendChild(deleteSectionButton);
  }

  const divider = document.createElement("div");
  divider.className = "section-divider";
  sectionEl.appendChild(divider);

  if (section.type === "custom") {
    for (const block of (section.blocks || [])) {
      sectionEl.appendChild(renderCustomBlock(block));
    }
    sectionEl.appendChild(renderCustomBlockActions(section.id));
    return sectionEl;
  }

  // Skills: bullets directly, no entry header, no inline add
  if (section.type === "skills") {
    const entry = section.entries[0];
    if (entry) {
      const list = document.createElement("ul");
      list.className = "skills-list";
      list.dataset.entryId = entry.id;
      for (const bullet of entry.bullets) {
        list.appendChild(renderBulletRow(bullet));
      }
      sectionEl.appendChild(list);
    }
    return sectionEl;
  }

  // Other sections — no inline add button, gutter handles it
  for (const entry of section.entries) {
    sectionEl.appendChild(renderEntry(entry, section.type === "experience" ? section.id : ""));
  }

  return sectionEl;
}

function renderCustomBlock(block) {
  const wrapper = document.createElement("div");
  wrapper.className = `custom-block custom-block-${block.type}`;
  wrapper.dataset.blockId = block.id;

  if (block.type === "text") {
    const text = document.createElement("p");
    text.className = "custom-text editable-placeholder";
    text.contentEditable = "plaintext-only";
    text.dataset.textBlockId = block.id;
    text.dataset.empty = serializeInlineText(block.content) ? "false" : "true";
    text.dataset.placeholder = "输入内容";
    text.setAttribute("aria-label", "编辑正文");
    text.appendChild(renderInlineContent(block.content || []));
    wrapper.appendChild(text);
  } else if (block.type === "list") {
    const list = document.createElement("ul");
    list.className = "custom-list entry-bullets";
    list.dataset.entryId = block.id;
    for (const bullet of (block.bullets || [])) list.appendChild(renderBulletRow(bullet));
    wrapper.appendChild(list);
  } else {
    wrapper.appendChild(renderEntry(block));
  }

  if (block.type !== "entry") {
    const deleteButton = document.createElement("button");
    deleteButton.className = "btn-del-block no-print";
    deleteButton.type = "button";
    deleteButton.textContent = "×";
    deleteButton.title = "删除该内容";
    deleteButton.setAttribute("aria-label", "删除该内容");
    deleteButton.dataset.blockId = block.id;
    wrapper.appendChild(deleteButton);
  }
  return wrapper;
}

function serializeInlineText(tokens) {
  return (tokens || []).map((token) => token.value || "").join("");
}

function renderCustomBlockActions(sectionId) {
  const actions = document.createElement("div");
  actions.className = "custom-block-actions no-print";
  actions.setAttribute("aria-label", "新增板块内容");
  [
    ["text", "+ 正文"],
    ["list", "+ 列表"],
    ["entry", "+ 条目"],
  ].forEach(([type, label]) => {
    const button = document.createElement("button");
    button.className = "btn-add-block";
    button.type = "button";
    button.dataset.sectionId = sectionId;
    button.dataset.blockType = type;
    button.textContent = label;
    actions.appendChild(button);
  });
  return actions;
}
