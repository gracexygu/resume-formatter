/**
 * Exporter module.
 * Handles "Save as HTML" and PDF export.
 */

/**
 * Serialize Resume State to Schema v2 Markdown.
 * @param {object} state
 * @returns {string}
 */
function serializeStateToMarkdown(state) {
  const cleanScalar = (value) => String(value || "").replace(/[\r\n]+/g, " ").trim();
  const formatterState = encodeURIComponent(JSON.stringify(createFormatterFileState(state)));
  const lines = ["---", "schema_version: 2"];
  const frontmatter = [
    ["resume_name", state.resumeName],
    ["name", state.profile.name],
    ["headline", state.profile.headline],
    ["location", state.profile.location],
    ["phone", state.profile.phone],
    ["email", state.profile.email],
    ["website", state.profile.website],
    ["portfolio", state.profile.portfolio],
    ["github", state.profile.github],
    ["photo", state.photo && state.photo.source],
    [FORMATTER_STATE_FIELD, formatterState],
  ];

  frontmatter.forEach(([key, value]) => {
    const cleaned = cleanScalar(value);
    if (cleaned) lines.push(`${key}: ${cleaned}`);
  });
  lines.push("---", "");

  (state.sections || []).forEach((section) => {
    if (section.type === "custom") {
      lines.push("## custom", "", `title: ${cleanScalar(section.title) || "未命名板块"}`, "");
      (section.blocks || []).forEach((block) => {
        if (block.type === "text") {
          const value = serializeInlineMarkdown(block.content);
          if (value) lines.push(value, "");
          return;
        }
        if (block.type === "list") {
          (block.bullets || []).forEach((bullet) => {
            lines.push(`- ${serializeInlineMarkdown(bullet.content)}`);
          });
          lines.push("");
          return;
        }
        serializeEntryToMarkdown(lines, block, cleanScalar);
      });
      return;
    }
    const defaultTitle = getSectionTitle(section.type);
    const title = cleanScalar(section.title);
    lines.push(`## ${defaultTitle}`, "");
    if (title && title !== defaultTitle) lines.push(`title: ${title}`, "");
    (section.entries || []).forEach((entry) => {
      if (section.type === "skills") {
        (entry.bullets || []).forEach((bullet) => lines.push(`- ${serializeInlineMarkdown(bullet.content)}`));
        lines.push("");
      } else serializeEntryToMarkdown(lines, entry, cleanScalar);
    });
  });

  return lines.join("\n").replace(/\n{3,}/g, "\n\n").trimEnd() + "\n";
}

function createFormatterFileState(state) {
  const photo = state.photo || {};
  return {
    version: 1,
    layout: deepClone(state.layout || {}),
    photo: {
      scale: photo.scale,
      frameScale: photo.frameScale,
      frameOffsetX: photo.frameOffsetX,
      frameOffsetY: photo.frameOffsetY,
      offsetX: photo.offsetX,
      offsetY: photo.offsetY,
    },
    sections: (state.sections || []).map((section) => ({
      id: section.id,
      spacingBefore: section.spacingBefore,
      entries: (section.entries || []).map(createEntryPresentation),
      blocks: (section.blocks || []).map((block) => ({
        id: block.id,
        type: block.type,
        bullets: (block.bullets || []).map(createBulletPresentation),
      })),
    })),
  };
}

function createEntryPresentation(entry) {
  return {
    id: entry.id,
    bullets: (entry.bullets || []).map(createBulletPresentation),
  };
}

function createBulletPresentation(bullet) {
  let offset = 0;
  const fontSizeRanges = [];
  for (const token of (bullet.content || [])) {
    const length = String(token.value || "").length;
    const delta = Number(token.fontSizeDelta) || 0;
    if (delta && length > 0) fontSizeRanges.push([offset, offset + length, delta]);
    offset += length;
  }
  return {
    id: bullet.id,
    ...(bullet.markerStyle ? { markerStyle: bullet.markerStyle } : {}),
    ...(fontSizeRanges.length > 0 ? { fontSizeRanges } : {}),
  };
}

function serializeEntryToMarkdown(lines, entry, cleanScalar) {
  lines.push(`### ${cleanScalar(entry.name)}`);
  if (entry.role) lines.push(`role: ${cleanScalar(entry.role)}`);
  if (entry.date) lines.push(`date: ${cleanScalar(entry.date)}`);
  if (entry.location) lines.push(`location: ${cleanScalar(entry.location)}`);
  lines.push("");
  (entry.bullets || []).forEach((bullet) => {
    lines.push(`- ${serializeInlineMarkdown(bullet.content)}`);
  });
  lines.push("");
}

/**
 * @param {Array<{type:string,value:string}>} tokens
 * @returns {string}
 */
function serializeInlineMarkdown(tokens) {
  return (tokens || []).map((token) => {
    const value = String(token.value || "").replace(/[\r\n]+/g, " ");
    let formatted = token.href ? `[${value}](${token.href})` : value;
    if (token.type === "strong" && token.italic) formatted = `***${formatted}***`;
    else if (token.type === "strong") formatted = `**${formatted}**`;
    else if (token.italic) formatted = `*${formatted}*`;
    return formatted;
  }).join("");
}

/** Serialize Resume State to the supported JSON import schema. */
function serializeStateToJson(state) {
  const data = {
    schemaVersion: 2,
    resumeName: state.resumeName || "",
    profile: {
      name: state.profile.name || "",
      headline: state.profile.headline || "",
      location: state.profile.location || "",
      phone: state.profile.phone || "",
      email: state.profile.email || "",
      website: state.profile.website || "",
      portfolio: state.profile.portfolio || "",
      github: state.profile.github || "",
    },
    sections: (state.sections || []).map((section) => ({
      type: section.type,
      title: section.title || getSectionTitle(section.type),
      ...((section.type === "custom") ? {
        blocks: (section.blocks || []).map((block) => serializeCustomBlockToJson(block)),
      } : {}),
      entries: (section.entries || []).map((entry) => ({
        name: entry.name || "",
        role: entry.role || "",
        date: entry.date || "",
        location: entry.location || "",
        bullets: (entry.bullets || []).map((bullet) => serializeInlineMarkdown(bullet.content)),
      })),
    })),
  };
  return JSON.stringify(data, null, 2) + "\n";
}

function serializeCustomBlockToJson(block) {
  if (block.type === "text") {
    return { type: "text", content: serializeInlineMarkdown(block.content) };
  }
  if (block.type === "list") {
    return {
      type: "list",
      items: (block.bullets || []).map((bullet) => serializeInlineMarkdown(bullet.content)),
    };
  }
  return {
    type: "entry",
    name: block.name || "",
    role: block.role || "",
    date: block.date || "",
    location: block.location || "",
    bullets: (block.bullets || []).map((bullet) => serializeInlineMarkdown(bullet.content)),
  };
}

/**
 * Export current resume as a standalone HTML file.
 * @param {object} state
 * @param {string} [customFileName]
 */
function exportAsHtml(state, customFileName) {
  const fileName = customFileName || sanitizeFileName(state.resumeName || "resume");
  const fullName = fileName.endsWith(".html") ? fileName : `${fileName}.html`;

  const clonedDoc = cloneDocumentForExport(state);
  const html = serializeDocument(clonedDoc);

  downloadFile(html, fullName, "text/html");
}

/**
 * Clone the current document for export.
 * Injects fresh state and cleans up temporary UI.
 * @param {object} state
 * @returns {Document}
 */
function cloneDocumentForExport(state) {
  const clone = document.cloneNode(true);

  // Generate new documentId for exported copy
  const exportState = deepClone(state);
  exportState.documentId = generateId();
  exportState.metadata.lastSavedAt = new Date().toISOString();

  // Inject state into clone
  const existingScript = clone.querySelector("#embedded-resume-state");
  if (existingScript) existingScript.remove();

  const scriptEl = clone.createElement("script");
  scriptEl.id = "embedded-resume-state";
  scriptEl.type = "application/json";
  scriptEl.textContent = safeJsonSerialize(exportState);

  // Insert before first script or at end of body
  const firstScript = clone.querySelector("script");
  if (firstScript && firstScript.parentNode) {
    firstScript.parentNode.insertBefore(scriptEl, firstScript);
  } else {
    clone.body.appendChild(scriptEl);
  }

  // Clean up temporary UI
  cleanupExportClone(clone);

  return clone;
}

/**
 * Clean up temporary UI states from the cloned document.
 * @param {Document} clone
 */
function cleanupExportClone(clone) {
  // Remove active focus
  if (clone.activeElement) clone.activeElement.blur();

  // Clear selections
  if (clone.getSelection) {
    const sel = clone.getSelection();
    if (sel) sel.removeAllRanges();
  }

  // Clear contenteditable backgrounds
  clone.querySelectorAll("[contenteditable]").forEach((el) => {
    el.removeAttribute("contenteditable");
  });

  // Clear file input values
  clone.querySelectorAll("input[type=file]").forEach((el) => {
    el.value = "";
  });

  // Clear status region
  const statusRegion = clone.getElementById("status-region");
  if (statusRegion) {
    statusRegion.textContent = "";
  }

  // Remove dialog root content
  const dialogRoot = clone.getElementById("dialog-root");
  if (dialogRoot) {
    dialogRoot.innerHTML = "";
    dialogRoot.classList.remove("active");
  }

  // Remove toast containers
  clone.querySelectorAll(".toast-container").forEach((el) => el.remove());
}

/**
 * Serialize a Document to HTML string.
 * @param {Document} doc
 * @returns {string}
 */
function serializeDocument(doc) {
  return "<!DOCTYPE html>\n" + doc.documentElement.outerHTML;
}

/**
 * Trigger a file download.
 * @param {string} content
 * @param {string} fileName
 * @param {string} mimeType
 */
function downloadFile(content, fileName, mimeType) {
  const blob = new Blob([content], { type: mimeType });
  const url = URL.createObjectURL(blob);

  const a = document.createElement("a");
  a.href = url;
  a.download = fileName;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);

  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

/**
 * Ensure the portfolio contact is a real anchor before Chrome snapshots the
 * page for printing. This also repairs stale DOM created by older app builds.
 */
function preparePortfolioLinkForPrint() {
  if (typeof getState !== "function" || typeof getPortfolioContact !== "function") return;

  const currentState = getState();
  const portfolio = getPortfolioContact(currentState.profile && currentState.profile.portfolio);
  if (!portfolio || !portfolio.href) return;

  const current = document.querySelector('#contact-info [data-profile-field="portfolio"]');
  if (!current) return;

  let link = current;
  if (current.tagName !== "A") {
    link = document.createElement("a");
    link.textContent = portfolio.label;
    link.dataset.profileField = "portfolio";
    current.replaceWith(link);
  }

  link.className = "contact-item contact-link";
  link.setAttribute("href", portfolio.href);
  link.setAttribute("target", "_blank");
  link.setAttribute("rel", "noopener noreferrer");
}

/**
 * Export PDF via browser print.
 */
function exportPdf() {
  if (typeof preparePhotoForPrint === "function") preparePhotoForPrint();
  preparePortfolioLinkForPrint();
  requestAnimationFrame(() => window.print());
}

// js/overflow.js
/**
 * A4 Overflow Detection module.
 * Detects whether resume content exceeds single A4 page.
 */

const OVERFLOW_TOLERANCE_PX = 2;
let _a4StatusFrame = 0;
let _a4StatusTimer = 0;
let _a4StatusSuspended = false;

function setA4StatusSuspended(suspended) {
  _a4StatusSuspended = suspended;
  if (!suspended) scheduleA4Status();
}

/** Coalesce repeated layout measurements caused by sliders and ResizeObserver. */
function scheduleA4Status(delay = 0) {
  if (_a4StatusSuspended) return;
  if (_a4StatusFrame) cancelAnimationFrame(_a4StatusFrame);
  if (_a4StatusTimer) clearTimeout(_a4StatusTimer);
  _a4StatusTimer = window.setTimeout(() => {
    _a4StatusTimer = 0;
    _a4StatusFrame = requestAnimationFrame(() => {
      _a4StatusFrame = 0;
      updateA4Status();
    });
  }, delay);
}

/**
 * Measure 297mm in pixels at current zoom/DPI by injecting a temporary ruler.
 * @returns {number}
 */
function getA4HeightPx() {
  const ruler = document.createElement("div");
  ruler.style.cssText =
    "position:fixed;top:0;left:-9999px;width:1px;height:297mm;" +
    "visibility:hidden;pointer-events:none;";
  document.body.appendChild(ruler);
  const h = ruler.offsetHeight;
  ruler.remove();
  return h;
}

/** Measure the same content flow that will be exported, excluding editor UI. */
function getPrintableContentHeightPx(contentEl) {
  const pageEl = document.getElementById("resume-page");
  if (!pageEl) return contentEl.offsetHeight;

  pageEl.classList.add("a4-measuring");
  const height = contentEl.offsetHeight;
  pageEl.classList.remove("a4-measuring");
  return height;
}

/**
 * Check if resume content overflows the A4 page.
 * @returns {{ overflow: boolean, pxBeyond: number, mmBeyond: number, firstOverflowSection: string|null }}
 */
function checkOverflow() {
  const contentEl = document.getElementById("resume-content");
  if (!contentEl) return { overflow: false, pxBeyond: 0, mmBeyond: 0, firstOverflowSection: null };

  const a4Px      = getA4HeightPx();
  const contentPx = getPrintableContentHeightPx(contentEl);
  const overflowPx = Math.max(0, contentPx - a4Px);
  const overflow   = overflowPx > OVERFLOW_TOLERANCE_PX;

  let firstOverflowSection = null;

  if (overflow) {
    // Find first section that extends below the A4 boundary
    const pageRect  = contentEl.getBoundingClientRect();
    const a4Bottom  = pageRect.top + a4Px;

    const sections = contentEl.querySelectorAll(".resume-section");
    for (const section of sections) {
      const rect = section.getBoundingClientRect();
      if (rect.bottom > a4Bottom + OVERFLOW_TOLERANCE_PX) {
        firstOverflowSection =
          section.dataset.sectionType ||
          section.querySelector(".section-title")?.textContent ||
          null;
        break;
      }
    }
  }

  return { overflow, pxBeyond: overflowPx, mmBeyond: pxToMm(overflowPx), firstOverflowSection };
}

/**
 * Update A4 status display and fix button label.
 */
function updateA4Status() {
  const statusEl = document.getElementById("a4-status");
  const btnLabel  = document.getElementById("btn-fix-label");
  const fixBtn    = document.getElementById("btn-fix-overflow");
  const result    = checkOverflow();

  if (result.overflow) {
    const msg = `⚠️ 超出 A4 约 ${result.mmBeyond.toFixed(1)} mm`;
    if (statusEl)  { statusEl.textContent = msg; statusEl.style.color = "#dc2626"; }
    if (btnLabel)  btnLabel.textContent = `修复溢出 ${result.mmBeyond.toFixed(1)}mm`;
    if (fixBtn) {
      fixBtn.hidden = false;
      fixBtn.title = `${msg}，点击自动压缩排版`;
      fixBtn.classList.add("toolbar-btn-warn");
    }
  } else {
    if (statusEl)  { statusEl.textContent = "✓ A4 排版正常"; statusEl.style.color = "#16a34a"; }
    if (btnLabel)  btnLabel.textContent = "修复溢出";
    if (fixBtn) {
      fixBtn.hidden = true;
      fixBtn.title = "修复 A4 内容溢出";
      fixBtn.classList.remove("toolbar-btn-warn");
    }
  }
}

/**
 * Auto-fix overflow by progressively reducing section spacings,
 * then line-height if spacings are exhausted.
 * Forces layout reflow between iterations to get accurate measurements.
 */
function autoFixOverflow() {
  let result = checkOverflow();

  if (!result.overflow) return;

  const state = getState();
  const DEFAULT_SPACING = 0;
  const lineHeightInput = document.getElementById("line-height-slider");
  const minLineHeight = Number(lineHeightInput && lineHeightInput.min) || 1.15;
  const lineHeightStep = Number(lineHeightInput && lineHeightInput.step) || 0.01;
  const MAX_ITER = 200;
  let changed = false;

  for (let i = 0; i < MAX_ITER && result.overflow; i++) {
    const sections = state.sections;
    const totalSpacing = sections.reduce((sum, s) => {
      const spacing = s.spacingBefore !== undefined ? s.spacingBefore : DEFAULT_SPACING;
      return sum + Math.max(0, spacing);
    }, 0);

    if (totalSpacing > 0.1) {
      // Reduce section spacings proportionally (with 15% buffer)
      const target = Math.max(0, totalSpacing - result.mmBeyond * 1.15);
      const factor = target / totalSpacing;
      let spacingChanged = false;
      sections.forEach(s => {
        const cur = s.spacingBefore !== undefined ? s.spacingBefore : DEFAULT_SPACING;
        if (cur > 0) {
          const next = Math.max(0, Math.round(cur * factor * 10) / 10);
          if (next !== cur) {
            s.spacingBefore = next;
            spacingChanged = true;
            changed = true;
          }
        }
      });

      // Rounding must not leave the loop repeatedly measuring identical layout.
      if (!spacingChanged) {
        const section = sections.find(s =>
          (s.spacingBefore !== undefined ? s.spacingBefore : DEFAULT_SPACING) > 0
        );
        if (section) {
          const cur = section.spacingBefore !== undefined ? section.spacingBefore : DEFAULT_SPACING;
          section.spacingBefore = Math.max(0, Math.round((cur - 0.1) * 10) / 10);
          changed = true;
        }
      }

      // Apply the actual spacing values before measuring the next iteration.
      renderSections(state);
    } else {
      // Spacings exhausted — shrink line-height stored in state.layout
      if (!state.layout) state.layout = {};
      const curLH = Number(state.layout.lineHeight) || 1.57;
      const nextLH = Math.max(
        minLineHeight,
        Math.round((curLH - lineHeightStep) * 100) / 100
      );
      if (nextLH >= curLH) break;
      state.layout.lineHeight = nextLH;
      changed = true;
      if (typeof applyLineHeight === "function") applyLineHeight(nextLH);
    }

    // Force reflow then re-measure
    const contentEl = document.getElementById("resume-content");
    if (contentEl) contentEl.offsetHeight; // eslint-disable-line no-unused-expressions
    result = checkOverflow();
  }

  if (typeof applyLayoutState === "function") applyLayoutState(state);
  updateA4Status();
  if (changed && typeof markDirty === "function") markDirty();

  if (result.overflow) {
    showToast(`仍超出约 ${result.mmBeyond.toFixed(1)} mm，视觉参数已到可读下限。`, "warning");
  } else {
    showToast("已自动修复，A4 排版正常。", "success");
  }
}

/**
 * Initialize overflow detection via ResizeObserver.
 */
function initOverflowDetection() {
  const contentEl = document.getElementById("resume-content");
  if (!contentEl) return;

  if (typeof ResizeObserver !== "undefined") {
    const observer = new ResizeObserver(() => {
      if (_a4StatusSuspended) return;
      scheduleA4Status(100);
    });
    observer.observe(contentEl);
  }

  updateA4Status();
}

// js/photo.js
/**
 * Photo module.
 * Handles upload, compression, drag, zoom, delete, reset.
 */

const PHOTO_MAX_FILE_MB = 10;
const PHOTO_MAX_EDGE_PX = 1600;
const PHOTO_TARGET_KB = 500;

/**
 * Initialize photo upload, crop controls, frame movement, and frame sizing.
 */
function initPhoto() {
  const btnUpload = document.getElementById("btn-photo-upload");
  const btnDelete = document.getElementById("btn-photo-delete");
  const btnReset = document.getElementById("btn-photo-reset");
  const scaleInput = document.getElementById("photo-scale");
  const sizeInput = document.getElementById("photo-size-slider");
  const photoInput = document.getElementById("file-input-photo");
  const container = document.getElementById("photo-container");

  if (btnUpload && photoInput) btnUpload.addEventListener("click", () => photoInput.click());

  if (photoInput) {
    photoInput.addEventListener("change", (e) => {
      const file = e.target.files && e.target.files[0];
      if (!file) return;
      photoInput.value = "";
      handlePhotoFile(file);
    });
  }

  if (btnDelete) btnDelete.addEventListener("click", clearPhoto);

  if (scaleInput) {
    scaleInput.addEventListener("input", () => {
      const state = getState();
      state.photo.scale = parseFloat(scaleInput.value);
      applyPhotoTransform(state.photo);
      markDirty();
    });
  }

  if (btnReset) {
    btnReset.addEventListener("click", () => {
      const state = getState();
      state.photo.scale = 1;
      state.photo.frameOffsetX = 0;
      state.photo.frameOffsetY = 0;
      state.photo.offsetX = 0;
      state.photo.offsetY = 0;
      if (scaleInput) scaleInput.value = "1";
      applyPhotoFramePosition(state.photo);
      applyPhotoTransform(state.photo);
      markDirty();
    });
  }

  if (sizeInput) {
    sizeInput.addEventListener("input", () => {
      const state = getState();
      state.photo.frameScale = parseFloat(sizeInput.value) / 100;
      applyPhotoFrameSize(state.photo);
      renderPhoto(state);
      markDirty();
      requestAnimationFrame(() => updateA4Status());
    });
  }

  if (container && photoInput) {
    container.addEventListener("click", (event) => {
      if (event.target.closest(".photo-delete-btn")) {
        event.stopPropagation();
        clearPhoto();
      } else if (event.target.closest(".photo-frame-handle")) {
        event.stopPropagation();
      } else if (container.dataset.empty === "true") {
        photoInput.click();
      }
    });
    container.addEventListener("keydown", (event) => {
      if (container.dataset.empty !== "true" || (event.key !== "Enter" && event.key !== " ")) return;
      event.preventDefault();
      photoInput.click();
    });
  }

  initPhotoDrag();
  initPhotoFrameDrag();
  updatePhotoControls();
  applyPhotoFrameSize(getState().photo);
  applyPhotoFramePosition(getState().photo);
}

/**
 * Handle a photo File object: validate, compress, store in state, render.
 * @param {File} file
 */
function handlePhotoFile(file) {
  buildPhotoStateFromFile(file, getState().photo)
    .then((photo) => {
      const state = getState();
      state.photo = photo;
      renderPhoto(state);
      updatePhotoControls();
      markDirty();
    })
    .catch((error) => showToast(error.message || "图片读取失败。", "error"));
}

/** Convert an image File into the persisted photo state. */
function buildPhotoStateFromFile(file, previousPhoto = {}) {
  const supported = ["image/jpeg", "image/png", "image/webp"];
  if (!supported.includes(file.type)) {
    return Promise.reject(new Error("不支持的图片格式，请上传 JPEG、PNG 或 WebP。"));
  }
  if (file.size > PHOTO_MAX_FILE_MB * 1024 * 1024) {
    return Promise.reject(new Error(`图片超过 ${PHOTO_MAX_FILE_MB}MB，请压缩后再上传。`));
  }

  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = (e) => {
      compressPhoto(e.target.result, file.type, (compressed, mimeType, w, h) => {
        resolve({
          source: "",
          dataUrl: compressed,
          mimeType,
          originalWidth: w,
          originalHeight: h,
          scale: 1,
          frameScale: previousPhoto.frameScale || 1,
          frameOffsetX: Number(previousPhoto.frameOffsetX) || 0,
          frameOffsetY: Number(previousPhoto.frameOffsetY) || 0,
          offsetX: 0,
          offsetY: 0,
        });
      });
    };
    reader.onerror = () => reject(new Error("图片读取失败。"));
    reader.readAsDataURL(file);
  });
}

/**
 * Compress a photo via Canvas.
 * @param {string} dataUrl
 * @param {string} mimeType
 * @param {Function} callback (compressedDataUrl, mimeType, width, height)
 */
function compressPhoto(dataUrl, mimeType, callback) {
  const img = new Image();
  img.onload = () => {
    let { width, height } = img;
    const maxEdge = PHOTO_MAX_EDGE_PX;

    if (width > maxEdge || height > maxEdge) {
      if (width >= height) {
        height = Math.round(height * maxEdge / width);
        width = maxEdge;
      } else {
        width = Math.round(width * maxEdge / height);
        height = maxEdge;
      }
    }

    const canvas = document.createElement("canvas");
    canvas.width = width;
    canvas.height = height;
    const ctx = canvas.getContext("2d");
    ctx.drawImage(img, 0, 0, width, height);

    // Try JPEG first for size; fall back to original type
    const outType = mimeType === "image/png" ? "image/png" : "image/jpeg";
    const quality = 0.85;
    const compressed = canvas.toDataURL(outType, quality);
    callback(compressed, outType, width, height);
  };
  img.onerror = () => {
    showToast("图片解码失败。", "error");
  };
  img.src = dataUrl;
}

/**
 * Apply CSS transform to the photo img element from photo state.
 * @param {object} photo
 */
function applyPhotoTransform(photo) {
  const container = document.getElementById("photo-container");
  if (!container) return;
  const img = container.querySelector("img");
  if (!img) return;
  const offsetX = pxToMm(Number(photo && photo.offsetX) || 0);
  const offsetY = pxToMm(Number(photo && photo.offsetY) || 0);
  const scale = Math.max(0.1, Number(photo && photo.scale) || 1);
  img.style.setProperty("--photo-image-offset-x", `${offsetX.toFixed(4)}mm`);
  img.style.setProperty("--photo-image-offset-y", `${offsetY.toFixed(4)}mm`);
  img.style.setProperty("--photo-image-scale", String(scale));
}

function applyPhotoFrameSize(photo) {
  const page = document.getElementById("resume-page");
  if (!page) return;
  const baseWidth = 20.1;
  const baseHeight = 24.4;
  const frameScale = Math.max(0.4, Math.min(2, Number(photo && photo.frameScale) || 1));
  page.style.setProperty("--photo-w", `${(baseWidth * frameScale).toFixed(2)}mm`);
  page.style.setProperty("--photo-h", `${(baseHeight * frameScale).toFixed(2)}mm`);

  const input = document.getElementById("photo-size-slider");
  const output = document.getElementById("photo-size-value");
  const percent = Math.round(frameScale * 100);
  if (input) input.value = String(percent);
  if (output) output.textContent = `${percent}%`;
}

function applyPhotoFramePosition(photo) {
  const page = document.getElementById("resume-page");
  if (!page) return;
  const x = Number(photo && photo.frameOffsetX) || 0;
  const y = Number(photo && photo.frameOffsetY) || 0;
  page.style.setProperty("--photo-frame-offset-x", `${x}mm`);
  page.style.setProperty("--photo-frame-offset-y", `${y}mm`);
}

/** Freeze the on-screen photo frame geometry for the print layout. */
function preparePhotoForPrint() {
  const page = document.getElementById("resume-page");
  const container = document.getElementById("photo-container");
  if (!page || !container || container.dataset.empty === "true") return;

  const pageRect = page.getBoundingClientRect();
  const frameRect = container.getBoundingClientRect();
  page.classList.add("photo-print-prepared");
  page.style.setProperty("--photo-print-x", `${pxToMm(frameRect.left - pageRect.left).toFixed(4)}mm`);
  page.style.setProperty("--photo-print-y", `${pxToMm(frameRect.top - pageRect.top).toFixed(4)}mm`);
  page.style.setProperty("--photo-print-w", `${pxToMm(frameRect.width).toFixed(4)}mm`);
  page.style.setProperty("--photo-print-h", `${pxToMm(frameRect.height).toFixed(4)}mm`);
}

function updatePhotoControls() {
  const state = getState();
  const hasPhoto = !!(state.photo && state.photo.dataUrl);
  const btnDelete = document.getElementById("btn-photo-delete");
  const controls = document.querySelector(".photo-controls");
  const scaleInput = document.getElementById("photo-scale");
  if (btnDelete) btnDelete.hidden = !hasPhoto;
  if (controls) controls.hidden = !hasPhoto;
  if (scaleInput) scaleInput.value = String((state.photo && state.photo.scale) || 1);
}

function clearPhoto() {
  const state = getState();
  const frameScale = state.photo && state.photo.frameScale ? state.photo.frameScale : 1;
  const frameOffsetX = Number(state.photo && state.photo.frameOffsetX) || 0;
  const frameOffsetY = Number(state.photo && state.photo.frameOffsetY) || 0;
  state.photo = {
    source: "",
    dataUrl: "", mimeType: "", originalWidth: 0, originalHeight: 0,
    scale: 1, frameScale, frameOffsetX, frameOffsetY, offsetX: 0, offsetY: 0,
  };
  renderPhoto(state);
  updatePhotoControls();
  markDirty();
}

/**
 * Initialize photo drag via Pointer Events.
 */
function initPhotoDrag() {
  const container = document.getElementById("photo-container");
  if (!container) return;

  let dragging = false;
  let startX = 0, startY = 0;
  let startOffsetX = 0, startOffsetY = 0;

  container.addEventListener("pointerdown", (e) => {
    if (e.target.closest(".photo-delete-btn, .photo-frame-handle")) return;
    const img = container.querySelector("img");
    if (!img) return;
    e.preventDefault();
    dragging = true;
    startX = e.clientX;
    startY = e.clientY;
    const state = getState();
    startOffsetX = state.photo.offsetX;
    startOffsetY = state.photo.offsetY;
    container.setPointerCapture(e.pointerId);
  });

  container.addEventListener("pointermove", (e) => {
    if (!dragging) return;
    const dx = e.clientX - startX;
    const dy = e.clientY - startY;
    const state = getState();
    state.photo.offsetX = startOffsetX + dx;
    state.photo.offsetY = startOffsetY + dy;
    applyPhotoTransform(state.photo);
  });

  container.addEventListener("pointerup", () => {
    if (dragging) markDirty();
    dragging = false;
  });
  container.addEventListener("pointercancel", () => { dragging = false; });
}

/** Move the entire photo frame without changing its internal crop. */
function initPhotoFrameDrag() {
  const container = document.getElementById("photo-container");
  if (!container) return;

  let dragging = false;
  let startX = 0, startY = 0;
  let startOffsetX = 0, startOffsetY = 0;
  let pxPerMm = 1;

  container.addEventListener("pointerdown", (event) => {
    const handle = event.target.closest(".photo-frame-handle");
    if (!handle || event.button !== 0) return;
    event.preventDefault();
    event.stopPropagation();
    const photo = getState().photo;
    dragging = true;
    startX = event.clientX;
    startY = event.clientY;
    startOffsetX = Number(photo.frameOffsetX) || 0;
    startOffsetY = Number(photo.frameOffsetY) || 0;
    pxPerMm = getPxPerMm();
    handle.classList.add("dragging");
    handle.setPointerCapture(event.pointerId);
  });

  container.addEventListener("pointermove", (event) => {
    if (!dragging) return;
    const photo = getState().photo;
    photo.frameOffsetX = Math.round((startOffsetX + (event.clientX - startX) / pxPerMm) * 2) / 2;
    photo.frameOffsetY = Math.round((startOffsetY + (event.clientY - startY) / pxPerMm) * 2) / 2;
    applyPhotoFramePosition(photo);
  });

  const finishDrag = (event) => {
    if (!dragging) return;
    dragging = false;
    const handle = event && event.target.closest(".photo-frame-handle");
    if (handle) handle.classList.remove("dragging");
    markDirty();
    updateA4Status();
  };
  container.addEventListener("pointerup", finishDrag);
  container.addEventListener("pointercancel", finishDrag);

  container.addEventListener("dblclick", (event) => {
    if (!event.target.closest(".photo-frame-handle")) return;
    event.preventDefault();
    const photo = getState().photo;
    photo.frameOffsetX = 0;
    photo.frameOffsetY = 0;
    applyPhotoFramePosition(photo);
    markDirty();
  });

  container.addEventListener("keydown", (event) => {
    if (!event.target.closest(".photo-frame-handle") || !["ArrowLeft", "ArrowRight", "ArrowUp", "ArrowDown", "Home"].includes(event.key)) return;
    event.preventDefault();
    const photo = getState().photo;
    const amount = event.shiftKey ? 2 : 0.5;
    if (event.key === "Home") {
      photo.frameOffsetX = 0;
      photo.frameOffsetY = 0;
    } else {
      photo.frameOffsetX = (Number(photo.frameOffsetX) || 0) + (event.key === "ArrowLeft" ? -amount : event.key === "ArrowRight" ? amount : 0);
      photo.frameOffsetY = (Number(photo.frameOffsetY) || 0) + (event.key === "ArrowUp" ? -amount : event.key === "ArrowDown" ? amount : 0);
    }
    applyPhotoFramePosition(photo);
    markDirty();
  });
}

// js/app.js
/**
 * Main application entry point.
 * Initializes state, wires up toolbar buttons, manages import/export lifecycle.
 */

/** @type {string} */
const APP_STATE_KEY = "resume-formatter:app-state-v1";

document.addEventListener("DOMContentLoaded", () => {
  const initialState = loadInitialState();
  setState(initialState);

  if (initialState.sections && initialState.sections.length > 0) {
    renderResume(initialState);
  } else if (typeof DEFAULT_RESUME_MD !== "undefined") {
    // Auto-load the baked-in sample resume on first open
    const parseResult = parseMarkdown(DEFAULT_RESUME_MD);
    const validation  = validateAndBuildState(parseResult, DEFAULT_RESUME_FILENAME || "sample-resume.md");
    if (validation.state) {
      setState(validation.state);
      renderResume(validation.state);
    }
  } else {
    updateStatusInfo(initialState);
  }

  applyLayoutState(getState());

  initOverflowDetection();
  initEditor();
  initPhoto();

  // Wire up toolbar buttons
  wireToolbar();
  initThemeSwitcher();
  initToolbarMenus();
  initResumeListPanel();
  initJsonImport();
  initMarkdownPaste();
  requestAnimationFrame(() => updateA4Status());
});

/**
 * Wire up toolbar button event listeners.
 */
function wireToolbar() {
  const btnImport = document.getElementById("btn-import-md");
  const btnExportPdf = document.getElementById("btn-export-pdf");
  const fileInput = document.getElementById("file-input-md");

  const btnAddSection = document.getElementById("btn-add-section");
  if (btnAddSection) {
    btnAddSection.addEventListener("click", () => {
      showInputDialog({
        title: "新增板块",
        message: "板块名称可以随时在简历中修改。",
        defaultValue: "",
        confirmText: "创建",
        onSubmit: addSection,
      });
    });
  }

  // Open a Markdown file. File System Access keeps the writable handle so
  // subsequent saves update the same local file.
  if (btnImport && fileInput) {
    btnImport.addEventListener("click", () => openMarkdownFile(fileInput));

    fileInput.addEventListener("change", (e) => {
      const files = e.target.files;
      if (!files || files.length === 0) return;
      handleImport(files[0], fileInput);
    });
  }

  // Fix overflow button
  const btnFix = document.getElementById("btn-fix-overflow");
  if (btnFix) {
    btnFix.addEventListener("click", () => autoFixOverflow());
  }

  // Font-size slider
  const fsSlider = document.getElementById("font-size-slider");
  const fsValue  = document.getElementById("font-size-value");
  if (fsSlider) {
    fsSlider.addEventListener("input", () => {
      const pt = parseFloat(fsSlider.value);
      if (fsValue) fsValue.textContent = pt + "pt";
      applyFontSize(pt);
      const state = getState();
      if (!state.layout) state.layout = {};
      state.layout.fontSize = pt;
      markDirty();
      requestAnimationFrame(() => updateA4Status());
    });
  }
  const lhSlider = document.getElementById("line-height-slider");
  const lhValue  = document.getElementById("line-height-value");
  if (lhSlider) {
    lhSlider.addEventListener("input", () => {
      const lh = parseFloat(lhSlider.value);
      if (lhValue) lhValue.textContent = lh.toFixed(2);
      applyLineHeight(lh);
      const state = getState();
      if (!state.layout) state.layout = {};
      state.layout.lineHeight = lh;
      markDirty();
      requestAnimationFrame(() => updateA4Status());
    });
  }

  // New resume template
  const btnNew = document.getElementById("btn-new-resume");
  if (btnNew) {
    btnNew.addEventListener("click", handleNewResume);
  }
  const btnSave = document.getElementById("btn-save");
  if (btnSave) btnSave.addEventListener("click", () => handleSave());
  const btnSaveAs = document.getElementById("btn-save-as");
  if (btnSaveAs) btnSaveAs.addEventListener("click", () => handleSaveAs());

  // Export PDF
  if (btnExportPdf) {
    btnExportPdf.addEventListener("click", () => {
      handleExportPdf();
    });
  }
}

/**
 * Handle Markdown file import.
 * @param {File} file
 * @param {HTMLInputElement} fileInput
 */
function handleImport(file, fileInput) {
  const reader = new FileReader();

  reader.onload = async (e) => {
    const raw = e.target.result;
    const parseResult = parseMarkdown(raw);
    const validation = validateAndBuildState(parseResult, file.name);

    if (validation.state) {
      // Fallback imports do not expose a writable file handle.
      await hydrateReferencedPhoto(validation.state, { file });
      setState(validation.state);
      renderResume(validation.state);
      updateA4Status();
      detachActiveSource();
      renderResumeFileList([], "当前文件", false);
      clearDirty();
      showToast("已打开文件。当前浏览器无法关联原文件，请使用“另存为”保存。", "warning");
    } else {
      // Import had errors
      const errorMsgs = validation.errors
        .filter((err) => err.level === "error")
        .map((err) => err.message);

      showDialog({
        title: "导入失败",
        message: errorMsgs.join("\n") || "无法解析该 Markdown 文件。",
        buttons: [{ text: "好的", primary: true }],
      });
    }

    // Reset file input so same file can be re-imported
    fileInput.value = "";
  };

  reader.onerror = () => {
    showDialog({
      title: "Markdown 读取失败",
      message: `无法读取“${file.name}”。文件可能已被移动、重命名，或浏览器没有访问权限。请重新选择该文件。`,
      buttons: [{ text: "好的", primary: true }],
    });
  };

  reader.readAsText(file);
}

async function openMarkdownFile(fileInput) {
  if (!("showOpenFilePicker" in window)) {
    fileInput.click();
    return;
  }

  try {
    const [handle] = await window.showOpenFilePicker({
      multiple: false,
      types: [{
        description: "Markdown 简历",
        accept: { "text/markdown": [".md", ".markdown"] },
      }],
    });
    if (!handle) return;
    const sourceFile = { name: handle.name, entryName: handle.name, handle };
    const loaded = await loadResumeFromHandle(handle.name, handle, `source:${handle.name}`, sourceFile);
    if (!loaded) return;
    _dirHandle = null;
    renderResumeFileList([sourceFile], "当前文件", false);
    setDirectoryImportStatus(`已打开“${handle.name}”，保存将写回此文件。`, "success");
  } catch (error) {
    if (error && error.name === "AbortError") return;
    console.error("Failed to open Markdown file:", error);
    showDialog({
      title: "文件打开失败",
      message: error && error.message ? error.message : "无法读取所选 Markdown 文件。",
      buttons: [{ text: "好的", primary: true }],
    });
  }
}

/**
 * Apply a base font size by scaling all font-size CSS variables proportionally.
 * Product 1 baseline is 10pt. All other sizes keep its type hierarchy.
 * @param {number} pt
 */
function applyFontSize(pt) {
  const page = document.getElementById("resume-page");
  if (!page) return;
  page.style.setProperty("--font-size-body",          pt + "pt");
  page.style.setProperty("--font-size-small",          pt.toFixed(2) + "pt");
  page.style.setProperty("--font-size-entry-name",     pt.toFixed(2) + "pt");
  page.style.setProperty("--font-size-section-title",  (pt * 1.2).toFixed(2) + "pt");
  page.style.setProperty("--font-size-contact",        (pt * 1.05).toFixed(2) + "pt");
  page.style.setProperty("--font-size-headline",       (pt * 1.3).toFixed(2) + "pt");
  page.style.setProperty("--font-size-name",           (pt * 1.8).toFixed(2) + "pt");
}

function applyLineHeight(lineHeight) {
  const page = document.getElementById("resume-page");
  if (page) page.style.setProperty("--layout-line-height", String(lineHeight));
}

/** Apply persisted layout values and keep toolbar controls in sync. */
function applyLayoutState(state) {
  if (!state.layout) state.layout = {};
  const fontSize = Number(state.layout.fontSize) || 10;
  const lineHeight = Number(state.layout.lineHeight) || 1.57;
  const theme = ["a", "b", "c", "d"].includes(state.layout.theme) ? state.layout.theme : "a";
  state.layout.fontSize = fontSize;
  state.layout.lineHeight = lineHeight;
  state.layout.theme = theme;
  applyFontSize(fontSize);
  applyLineHeight(lineHeight);
  applyThemeVisual(theme);

  const fontSlider = document.getElementById("font-size-slider");
  const fontOutput = document.getElementById("font-size-value");
  const lineSlider = document.getElementById("line-height-slider");
  const lineOutput = document.getElementById("line-height-value");
  if (fontSlider) fontSlider.value = String(fontSize);
  if (fontOutput) fontOutput.textContent = `${fontSize}pt`;
  if (lineSlider) lineSlider.value = String(lineHeight);
  if (lineOutput) lineOutput.textContent = lineHeight.toFixed(2);
}

function applyThemeVisual(theme) {
  const page = document.getElementById("resume-page");
  if (page) page.dataset.theme = theme;
  const labels = { a: "黑体", b: "宋体", c: "思源", d: "学术" };
  for (const value of ["a", "b", "c", "d"]) {
    document.getElementById(`btn-theme-${value}`)?.classList.toggle("toolbar-btn-active", theme === value);
  }
  const themeLabel = document.getElementById("current-theme-label");
  if (themeLabel) themeLabel.textContent = labels[theme];
}

/**
 * Show a simple confirmation/info dialog.
 * @param {object} opts
 * @param {string} opts.title
 * @param {string} opts.message
 * @param {{ text: string, primary?: boolean, danger?: boolean, disabled?: boolean, title?: string, action?: Function }[]} opts.buttons
 */
function showDialog({ title, message, buttons }) {
  const root = document.getElementById("dialog-root");
  if (!root) return;

  root.innerHTML = "";
  root.classList.add("active");

  const backdrop = document.createElement("div");
  backdrop.className = "dialog-backdrop";
  backdrop.addEventListener("click", closeDialog);
  root.appendChild(backdrop);

  const box = document.createElement("div");
  box.className = "dialog-box";

  const titleEl = document.createElement("h3");
  titleEl.className = "dialog-title";
  titleEl.textContent = title;
  box.appendChild(titleEl);

  const msgEl = document.createElement("p");
  msgEl.className = "dialog-message";
  msgEl.style.whiteSpace = "pre-line";
  msgEl.textContent = message;
  box.appendChild(msgEl);

  const actions = document.createElement("div");
  actions.className = "dialog-actions";

  for (const btn of (buttons || [{ text: "确定", primary: true }])) {
    const btnEl = document.createElement("button");
    btnEl.className = "dialog-btn";
    if (btn.primary) btnEl.classList.add("dialog-btn-primary");
    if (btn.danger || btn.text.includes("删除") || btn.text.includes("恢复")) btnEl.classList.add("dialog-btn-danger");
    btnEl.disabled = Boolean(btn.disabled);
    if (btn.title) btnEl.title = btn.title;
    btnEl.textContent = btn.text;
    btnEl.addEventListener("click", () => {
      closeDialog();
      if (btn.action) btn.action();
    });
    actions.appendChild(btnEl);
  }

  box.appendChild(actions);
  root.appendChild(box);
}

/**
 * Show an input dialog.
 * @param {object} opts
 * @param {string} opts.title
 * @param {string} opts.message
 * @param {string} opts.defaultValue
 * @param {string} opts.confirmText
 * @param {Function} opts.onSubmit
 */
function showInputDialog({ title, message, defaultValue, confirmText, onSubmit }) {
  const root = document.getElementById("dialog-root");
  if (!root) return;

  root.innerHTML = "";
  root.classList.add("active");

  const backdrop = document.createElement("div");
  backdrop.className = "dialog-backdrop";
  backdrop.addEventListener("click", closeDialog);
  root.appendChild(backdrop);

  const box = document.createElement("div");
  box.className = "dialog-box";

  const titleEl = document.createElement("h3");
  titleEl.className = "dialog-title";
  titleEl.textContent = title;
  box.appendChild(titleEl);

  if (message) {
    const msgEl = document.createElement("p");
    msgEl.className = "dialog-message";
    msgEl.textContent = message;
    box.appendChild(msgEl);
  }

  const input = document.createElement("input");
  input.className = "dialog-input";
  input.type = "text";
  input.value = defaultValue || "";
  input.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && input.value.trim()) {
      closeDialog();
      onSubmit(input.value.trim());
    }
  });
  box.appendChild(input);

  const actions = document.createElement("div");
  actions.className = "dialog-actions";

  const cancelBtn = document.createElement("button");
  cancelBtn.className = "dialog-btn";
  cancelBtn.textContent = "取消";
  cancelBtn.addEventListener("click", closeDialog);
  actions.appendChild(cancelBtn);

  const confirmBtn = document.createElement("button");
  confirmBtn.className = "dialog-btn dialog-btn-primary";
  confirmBtn.textContent = confirmText || "确认";
  confirmBtn.addEventListener("click", () => {
    if (!input.value.trim()) return;
    closeDialog();
    onSubmit(input.value.trim());
  });
  actions.appendChild(confirmBtn);

  box.appendChild(actions);
  root.appendChild(box);

  // Focus input
  setTimeout(() => input.focus(), 50);
}

/**
 * Resume list panel — File System Access API based directory browser.
 * Directory handle is persisted in IndexedDB so it survives page reloads.
 */

/** @type {FileSystemDirectoryHandle|null} */
let _dirHandle = null;

/** @type {string|null} — filename of currently active resume */
let _activeFile = null;

/** @type {{name:string, handle:FileSystemFileHandle, parentDirectory?:FileSystemDirectoryHandle, entryName?:string}|null} */
let _activeSourceFile = null;

let _directoryFiles = [];
let _directoryName = "简历版本";
let _directoryCanRefresh = false;
let _directoryImportSequence = 0;
let _directoryStatusTimer = null;

const MD_SNAPSHOTS_KEY = "resume-formatter:md-snapshots-v1";
const PINNED_RESUMES_KEY = "resume-formatter:pinned-resumes-v1";

function loadPinnedResumes() {
  try {
    const parsed = JSON.parse(localStorage.getItem(PINNED_RESUMES_KEY) || "[]");
    return new Set(Array.isArray(parsed) ? parsed : []);
  } catch (e) {
    console.error("Failed to load pinned resumes:", e);
    return new Set();
  }
}

function getResumePinKey(type, id) {
  return `${type}:${id}`;
}

function toggleResumePin(pinKey) {
  const pinned = loadPinnedResumes();
  if (pinned.has(pinKey)) pinned.delete(pinKey);
  else pinned.add(pinKey);
  localStorage.setItem(PINNED_RESUMES_KEY, JSON.stringify([...pinned]));
  renderResumeFileList(_directoryFiles, _directoryName, _directoryCanRefresh);
}

function appendPinButton(listItem, pinKey, displayName, isPinned) {
  const button = document.createElement("button");
  button.className = `resume-list-action resume-list-pin${isPinned ? " active" : ""}`;
  button.textContent = isPinned ? "★" : "☆";
  button.title = isPinned ? "取消置顶" : "置顶";
  button.setAttribute("aria-label", `${isPinned ? "取消置顶" : "置顶"} ${displayName}`);
  button.setAttribute("aria-pressed", String(isPinned));
  button.addEventListener("click", (event) => {
    event.stopPropagation();
    toggleResumePin(pinKey);
  });
  listItem.appendChild(button);
}

function syncFocusedEditor() {
  const active = document.activeElement;
  if (active && active.closest && active.closest("#resume-content")) active.blur();
}

function getActiveSourceFile() {
  if (!_activeFile || !_activeFile.startsWith("source:")) return null;
  const sourceName = _activeFile.slice("source:".length);
  if (_activeSourceFile && _activeSourceFile.name === sourceName) return _activeSourceFile;
  return _directoryFiles.find((file) => file.name === sourceName) || null;
}

function detachActiveSource() {
  _activeFile = null;
  _activeSourceFile = null;
  document.querySelectorAll(".resume-list-item.active").forEach((item) => item.classList.remove("active"));
}

async function ensureFileWritePermission(handle) {
  if (!handle || typeof handle.createWritable !== "function") return false;
  if (typeof handle.queryPermission !== "function") return true;
  try {
    let permission = await handle.queryPermission({ mode: "readwrite" });
    if (permission !== "granted" && typeof handle.requestPermission === "function") {
      permission = await handle.requestPermission({ mode: "readwrite" });
    }
    return permission === "granted";
  } catch (error) {
    console.warn("Failed to request file write permission:", error);
    return false;
  }
}

async function writeResumeToSource(file, { forceMarkdown = false, showSuccess = true } = {}) {
  if (!file?.handle || typeof file.handle.createWritable !== "function") {
    showToast("当前文件不可写，请使用“另存为”。", "warning");
    return;
  }
  if (!await ensureFileWritePermission(file.handle)) {
    showDialog({
      title: "需要文件写入权限",
      message: `请允许写入“${file.name}”，才能保存当前修改。`,
      buttons: [{ text: "好的", primary: true }],
    });
    return;
  }

  const state = getState();
  const isJson = !forceMarkdown && /\.json$/i.test(file.name);
  const content = isJson ? serializeStateToJson(state) : serializeStateToMarkdown(state);
  const saveButton = document.getElementById("btn-save");
  if (saveButton) saveButton.disabled = true;

  try {
    const writable = await file.handle.createWritable();
    try {
      await writable.write(content);
      await writable.close();
    } catch (e) {
      try {
        await writable.abort();
      } catch {}
      throw e;
    }
    state.source.fileName = file.name;
    state.importSnapshot = createImportSnapshot(state);
    clearDirty();
    updateStatusInfo(state);
    if (showSuccess) showToast(`已保存到“${file.name}”。`, "success");
    return true;
  } catch (e) {
    console.error("Failed to save source file:", e);
    showDialog({
      title: "保存失败",
      message: `无法写入“${file.name}”：${e.message || "未知错误"}`,
      buttons: [{ text: "好的", primary: true }],
    });
  } finally {
    if (saveButton) saveButton.disabled = false;
  }
}

async function handleSaveAs() {
  syncFocusedEditor();
  const state = getState();
  if (!state.profile.name && (!state.sections || state.sections.length === 0)) {
    showToast("请先打开或导入简历。", "warning");
    return;
  }
  if (!("showSaveFilePicker" in window)) {
    showDialog({
      title: "当前浏览器不支持另存为",
      message: "请使用最新版桌面 Chrome 打开排版器，再选择新的 Markdown 文件位置。",
      buttons: [{ text: "好的", primary: true }],
    });
    return;
  }

  const sourceBaseName = (state.source?.fileName || "").split("/").pop()?.replace(/\.(?:md|markdown|json)$/i, "");
  const suggestedName = `${sanitizeFileName(sourceBaseName || state.resumeName || "resume")}-副本.md`;
  try {
    const handle = await window.showSaveFilePicker({
      suggestedName,
      ...( _dirHandle ? { startIn: _dirHandle } : {}),
      types: [{
        description: "Markdown 简历",
        accept: { "text/markdown": [".md", ".markdown"] },
      }],
    });
    const sourceFile = { name: handle.name, entryName: handle.name, handle };
    const saved = await writeResumeToSource(sourceFile, { forceMarkdown: true, showSuccess: false });
    if (!saved) return;

    _activeSourceFile = sourceFile;
    _activeFile = `source:${sourceFile.name}`;
    state.source.fileName = sourceFile.name;
    if (_dirHandle) {
      try {
        await refreshResumeList();
        const match = await findMatchingDirectoryFile(handle);
        if (match) {
          _activeSourceFile = match;
          _activeFile = `source:${match.name}`;
          state.source.fileName = match.name;
        }
        renderResumeFileList(_directoryFiles, _directoryName, _directoryCanRefresh);
      } catch (refreshError) {
        console.warn("Failed to refresh after Save As:", refreshError);
      }
    } else {
      renderResumeFileList([sourceFile], "当前文件", false);
    }
    updateStatusInfo(state);
    showToast(`已另存为“${state.source.fileName}”，后续保存将写入此文件。`, "success");
  } catch (error) {
    if (error && error.name === "AbortError") return;
    console.error("Failed to save resume as Markdown:", error);
    showDialog({
      title: "另存为失败",
      message: error && error.message ? error.message : "无法创建新的 Markdown 文件。",
      buttons: [{ text: "好的", primary: true }],
    });
  }
}

async function findMatchingDirectoryFile(handle) {
  if (!handle || typeof handle.isSameEntry !== "function") return null;
  for (const file of _directoryFiles) {
    try {
      if (await file.handle.isSameEntry(handle)) return file;
    } catch {}
  }
  return null;
}

function loadMarkdownSnapshots() {
  try {
    const parsed = JSON.parse(localStorage.getItem(MD_SNAPSHOTS_KEY) || "[]");
    return Array.isArray(parsed) ? parsed : [];
  } catch (e) {
    console.error("Failed to load Markdown snapshots:", e);
    return [];
  }
}

function saveMarkdownSnapshot(state, customName) {
  const now = new Date();
  const timestamp = [
    now.getFullYear(),
    String(now.getMonth() + 1).padStart(2, "0"),
    String(now.getDate()).padStart(2, "0"),
    "-",
    String(now.getHours()).padStart(2, "0"),
    String(now.getMinutes()).padStart(2, "0"),
    String(now.getSeconds()).padStart(2, "0"),
  ].join("");
  const baseName = sanitizeFileName(
    customName || state.resumeName || (state.source.fileName || "").replace(/\.(?:md|markdown|json)$/i, "") || "resume"
  ).replace(/\.(?:md|markdown|json)$/i, "");
  const snapshot = {
    id: generateId(),
    name: `${baseName}${customName ? "" : `-${timestamp}`}.md`,
    markdown: serializeStateToMarkdown(state),
    createdAt: now.toISOString(),
  };
  const snapshots = loadMarkdownSnapshots();
  snapshots.unshift(snapshot);
  localStorage.setItem(MD_SNAPSHOTS_KEY, JSON.stringify(snapshots));
  _activeFile = `snapshot:${snapshot.id}`;
  renderResumeFileList(_directoryFiles, _directoryName, _directoryCanRefresh);
  return snapshot;
}

function deleteMarkdownSnapshot(snapshotId) {
  const snapshots = loadMarkdownSnapshots().filter((snapshot) => snapshot.id !== snapshotId);
  localStorage.setItem(MD_SNAPSHOTS_KEY, JSON.stringify(snapshots));
  if (_activeFile === `snapshot:${snapshotId}`) _activeFile = null;
  renderResumeFileList(_directoryFiles, _directoryName, _directoryCanRefresh);
}

function renameMarkdownSnapshot(snapshotId) {
  const snapshots = loadMarkdownSnapshots();
  const snapshot = snapshots.find((item) => item.id === snapshotId);
  if (!snapshot) return;

  showInputDialog({
    title: "重命名副本",
    message: "输入新的副本名称：",
    defaultValue: snapshot.name.replace(/\.md$/i, ""),
    confirmText: "重命名",
    onSubmit: (name) => {
      const sanitized = sanitizeFileName(name).replace(/\.md$/i, "");
      if (!sanitized) return;
      snapshot.name = `${sanitized}.md`;
      localStorage.setItem(MD_SNAPSHOTS_KEY, JSON.stringify(snapshots));
      renderResumeFileList(_directoryFiles, _directoryName, _directoryCanRefresh);
    },
  });
}

const IDB_NAME    = "resume-formatter";
const IDB_STORE   = "config";
const IDB_DIR_KEY = "dir-handle";

/**
 * Open (or create) the IndexedDB database.
 * @returns {Promise<IDBDatabase>}
 */
function openIDB() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(IDB_NAME, 1);
    req.onupgradeneeded = (e) => {
      e.target.result.createObjectStore(IDB_STORE);
    };
    req.onsuccess = (e) => resolve(e.target.result);
    req.onerror   = (e) => reject(e.target.error);
  });
}

/**
 * Save directory handle to IndexedDB.
 * @param {FileSystemDirectoryHandle} handle
 */
async function saveDirHandle(handle) {
  try {
    const db = await openIDB();
    const tx = db.transaction(IDB_STORE, "readwrite");
    tx.objectStore(IDB_STORE).put(handle, IDB_DIR_KEY);
  } catch (e) {
    console.warn("Failed to save dir handle:", e);
  }
}

/**
 * Load directory handle from IndexedDB.
 * @returns {Promise<FileSystemDirectoryHandle|null>}
 */
async function loadDirHandle() {
  try {
    const db = await openIDB();
    return new Promise((resolve) => {
      const tx  = db.transaction(IDB_STORE, "readonly");
      const req = tx.objectStore(IDB_STORE).get(IDB_DIR_KEY);
      req.onsuccess = (e) => resolve(e.target.result || null);
      req.onerror   = ()  => resolve(null);
    });
  } catch {
    return null;
  }
}

function initResumeListPanel() {
  const btnPick    = document.getElementById("btn-pick-dir");
  const btnRefresh = document.getElementById("btn-refresh-dir");
  const directoryInput = document.getElementById("file-input-directory");

  if (directoryInput) {
    directoryInput.addEventListener("change", async () => {
      const selectedFiles = Array.from(directoryInput.files || []);
      if (selectedFiles.length === 0) return;

      const sequence = ++_directoryImportSequence;
      setDirectoryImportBusy(true);
      setDirectoryImportStatus("正在识别文件夹中的简历文件...");
      _dirHandle = null;
      const supportedFiles = selectedFiles.filter((file) => /\.(?:md|markdown|json)$/i.test(file.name));
      const firstPath = supportedFiles[0]?.webkitRelativePath || selectedFiles[0]?.webkitRelativePath || "";
      const rootName = firstPath.includes("/") ? firstPath.split("/")[0] : "导入文件夹";
      const relatedFiles = new Map(selectedFiles.map((file) => [
        stripDirectoryRoot(file.webkitRelativePath || file.name, rootName),
        file,
      ]));
      const candidates = supportedFiles.map((file) => ({
        name: stripDirectoryRoot(file.webkitRelativePath || file.name, rootName),
        handle: { getFile: async () => file },
        relatedFiles,
      }));
      const files = await filterRecognizableResumeFiles(candidates, sequence);
      if (sequence !== _directoryImportSequence) return;
      if (files.length === 0) {
        setDirectoryImportBusy(false);
        setDirectoryImportStatus("未找到可识别的 Markdown 或 JSON 简历。", "error");
        showDialog({
          title: "没有可识别的简历",
          message: "所选文件夹中没有符合当前简历格式的 Markdown 或 JSON 文件。",
          buttons: [{ text: "好的", primary: true }],
        });
        directoryInput.value = "";
        return;
      }
      renderResumeFileList(files, rootName, false);
      setDirectoryImportBusy(false);
      setDirectoryImportStatus(`已识别 ${files.length} 个文件，请在下方选择要打开的简历。`, "success");
      showToast(`已读取“${rootName}”：${files.length} 个简历文件。`, "success");
      directoryInput.value = "";
    });
  }

  if (btnPick) {
    btnPick.addEventListener("click", async () => {
      if (!("showDirectoryPicker" in window)) {
        if (directoryInput) {
          setDirectoryImportStatus("请选择包含 Markdown 或 JSON 简历的文件夹。");
          directoryInput.click();
        } else {
          setDirectoryImportStatus("当前浏览器不支持文件夹导入。", "error");
        }
        return;
      }
      const sequence = ++_directoryImportSequence;
      setDirectoryImportBusy(true);
      setDirectoryImportStatus("等待选择文件夹...");
      try {
        const handle = await window.showDirectoryPicker({ mode: "readwrite" });
        if (sequence !== _directoryImportSequence) return;
        _dirHandle = handle;
        setDirectoryImportStatus("正在扫描文件夹中的简历文件...");
        const files = await refreshResumeList(sequence);
        await saveDirHandle(handle);
        if (sequence !== _directoryImportSequence) return;
        setDirectoryImportBusy(false);
        if (files.length === 0) {
          setDirectoryImportStatus("未找到可识别的 Markdown 或 JSON 简历。", "error");
          showDialog({
            title: "没有可识别的简历",
            message: "所选文件夹中没有符合当前简历格式的 Markdown 或 JSON 文件。",
            buttons: [{ text: "好的", primary: true }],
          });
        } else {
          setDirectoryImportStatus(`已识别 ${files.length} 个文件，请在下方选择要打开的简历。`, "success");
          showToast(`已读取“${handle.name}”：${files.length} 个简历文件。`, "success");
        }
      } catch (e) {
        if (sequence !== _directoryImportSequence) return;
        setDirectoryImportBusy(false);
        if (e.name === "AbortError") {
          setDirectoryImportStatus("已取消选择文件夹。");
          return;
        }
        console.error("Failed to open resume directory:", e);
        const message = e && e.message ? e.message : "浏览器未提供目录读取权限";
        setDirectoryImportStatus(`读取失败：${message}`, "error");
        showDialog({
          title: "文件夹读取失败",
          message: `无法读取所选文件夹。${message}\n\n你仍可使用“打开文件”选择单个 Markdown。`,
          buttons: [{ text: "好的", primary: true }],
        });
      }
    });
  }

  if (btnRefresh) {
    btnRefresh.addEventListener("click", async () => {
      if (!_dirHandle) return;
      const sequence = ++_directoryImportSequence;
      setDirectoryImportBusy(true);
      setDirectoryImportStatus("正在刷新文件列表...");
      try {
        const files = await refreshResumeList(sequence);
        if (sequence !== _directoryImportSequence) return;
        setDirectoryImportBusy(false);
        setDirectoryImportStatus(`已刷新，共 ${files.length} 个文件。`, "success");
      } catch (e) {
        if (sequence !== _directoryImportSequence) return;
        setDirectoryImportBusy(false);
        console.error("Failed to refresh resume directory:", e);
        setDirectoryImportStatus("刷新目录失败：" + e.message, "error");
      }
    });
  }

  // Try to restore saved handle on startup
  restoreDirHandle();
  renderResumeFileList([], "简历版本", false);
}

/**
 * Try to restore directory handle from IndexedDB on page load.
 * If permission needs re-granting, show a notice in the panel.
 */
async function restoreDirHandle() {
  const sequence = _directoryImportSequence;
  const handle = await loadDirHandle();
  if (!handle || sequence !== _directoryImportSequence) return;

  try {
    // Check current permission state
    const perm = await handle.queryPermission({ mode: "read" });

    if (perm === "granted") {
      _dirHandle = handle;
      await refreshResumeList(sequence);
    } else {
      // Needs user gesture to re-grant — show reauth button
      _dirHandle = handle;
      showReauthNotice(handle);
    }
  } catch {
    // Handle stale or inaccessible — silently ignore
  }
}

/**
 * Show "重新授权" notice in the panel when permission needs re-granting.
 * @param {FileSystemDirectoryHandle} handle
 */
function showReauthNotice(handle) {

  const dirName = document.getElementById("panel-dir-name");

  if (dirName) {

    `;

          }
        } catch (e) {
          showToast("授权失败，请重新选择目录。", "error");
        }
      });
    }
  }

  const btnRefresh = document.getElementById("btn-refresh-dir");
  if (btnRefresh) btnRefresh.hidden = false;
}

/**
 * Read directory and populate the resume list.
 */
async function refreshResumeList(sequence = _directoryImportSequence) {
  if (!_dirHandle) return [];

  // Collect supported candidates recursively, then validate with bounded concurrency.
  const candidates = [];
  await collectResumeFiles(_dirHandle, "", candidates);
  const files = await filterRecognizableResumeFiles(candidates, sequence);

  if (sequence !== _directoryImportSequence) return files;
  renderResumeFileList(files, _dirHandle.name, true);
  return files;
}

async function isRecognizableResumeFile(file, fileName) {
  if (!/\.(?:md|markdown|json)$/i.test(fileName)) return false;
  try {
    const raw = await file.text();
    const validation = /\.json$/i.test(fileName)
      ? importJsonResume(raw, fileName)
      : validateAndBuildState(parseMarkdown(raw), fileName);
    return Boolean(validation.state);
  } catch (e) {
    console.warn(`Skipped unrecognized resume file: ${fileName}`, e);
    return false;
  }
}

async function filterRecognizableResumeFiles(candidates, sequence) {
  const recognized = new Array(candidates.length);
  let nextIndex = 0;
  const workerCount = Math.min(8, candidates.length);

  async function validateNext() {
    while (nextIndex < candidates.length && sequence === _directoryImportSequence) {
      const index = nextIndex++;
      const candidate = candidates[index];
      try {
        const file = await candidate.handle.getFile();
        if (await isRecognizableResumeFile(file, candidate.name)) {
          recognized[index] = candidate;
        }
      } catch (e) {
        console.warn(`Skipped unreadable resume file: ${candidate.name}`, e);
      }
    }
  }

  await Promise.all(Array.from({ length: workerCount }, () => validateNext()));
  return recognized.filter(Boolean);
}

function stripDirectoryRoot(path, rootName) {
  const prefix = `${rootName}/`;
  return path.startsWith(prefix) ? path.slice(prefix.length) : path;
}

async function ensureDirectoryWritePermission() {
  if (!_dirHandle) return false;
  try {
    let permission = await _dirHandle.queryPermission({ mode: "readwrite" });
    if (permission !== "granted") {
      permission = await _dirHandle.requestPermission({ mode: "readwrite" });
    }
    return permission === "granted";
  } catch (e) {
    console.warn("Failed to request directory write permission:", e);
    return false;
  }
}

function showDirectoryWriteRequired() {
  showDialog({
    title: "需要文件夹写入权限",
    message: "请使用“导入文件夹”重新选择该目录并允许读写，才能覆盖、重命名或删除其中的文件。",
    buttons: [{ text: "好的", primary: true }],
  });
}

async function deleteDirectoryResume(file) {
  if (!file.parentDirectory || !file.entryName) {
    showDirectoryWriteRequired();
    return;
  }
  if (!await ensureDirectoryWritePermission()) {
    showDirectoryWriteRequired();
    return;
  }

  try {
    await file.parentDirectory.removeEntry(file.entryName);
    if (_activeFile === `source:${file.name}`) _activeFile = null;
    try {
      await refreshResumeList();
    } catch (refreshError) {
      console.warn("Failed to refresh after deleting resume file:", refreshError);
    }
    showToast(`已删除“${file.name}”。`, "success");
  } catch (e) {
    console.error("Failed to delete resume file:", e);
    showDialog({
      title: "删除失败",
      message: `无法删除“${file.name}”：${e.message || "未知错误"}`,
      buttons: [{ text: "好的", primary: true }],
    });
  }
}

function confirmDeleteDirectoryResume(file) {
  const fileType = /\.json$/i.test(file.name) ? "JSON" : "Markdown";
  showDialog({
    title: `删除 ${fileType} 文件`,
    message: `确定删除“${file.name}”吗？\n\n确认后将从原目录中永久删除该文件，此操作无法在排版器中撤销。`,
    buttons: [
      { text: "取消" },
      { text: "确认删除", action: () => deleteDirectoryResume(file) },
    ],
  });
}

function renameDirectoryResume(file) {
  if (!file.parentDirectory || !file.entryName) {
    showDirectoryWriteRequired();
    return;
  }

  const extensionMatch = file.entryName.match(/(\.(?:md|markdown|json))$/i);
  const extension = extensionMatch ? extensionMatch[1] : "";
  const baseName = extension ? file.entryName.slice(0, -extension.length) : file.entryName;
  showInputDialog({
    title: "重命名简历文件",
    message: `文件位置：${file.name}`,
    defaultValue: baseName,
    confirmText: "重命名",
    onSubmit: async (name) => {
      const sanitized = sanitizeFileName(name).replace(/\.(?:md|markdown|json)$/i, "");
      const nextEntryName = `${sanitized}${extension}`;
      if (!sanitized || nextEntryName === file.entryName) return;
      if (!await ensureDirectoryWritePermission()) {
        showDirectoryWriteRequired();
        return;
      }

      try {
        try {
          await file.parentDirectory.getFileHandle(nextEntryName);
          showDialog({
            title: "无法重命名",
            message: `同一目录中已存在“${nextEntryName}”。`,
            buttons: [{ text: "好的", primary: true }],
          });
          return;
        } catch (e) {
          if (e.name !== "NotFoundError") throw e;
        }

        const source = await file.handle.getFile();
        const nextHandle = await file.parentDirectory.getFileHandle(nextEntryName, { create: true });
        const writable = await nextHandle.createWritable();
        try {
          await writable.write(source);
          await writable.close();
        } catch (e) {
          try {
            await writable.abort();
          } catch {}
          try {
            await file.parentDirectory.removeEntry(nextEntryName);
          } catch {}
          throw e;
        }
        try {
          await file.parentDirectory.removeEntry(file.entryName);
        } catch (e) {
          try {
            await file.parentDirectory.removeEntry(nextEntryName);
          } catch {}
          throw e;
        }

        const parentPath = file.name.includes("/") ? file.name.slice(0, file.name.lastIndexOf("/") + 1) : "";
        const nextName = `${parentPath}${nextEntryName}`;
        if (_activeFile === `source:${file.name}`) _activeFile = `source:${nextName}`;
        try {
          await refreshResumeList();
        } catch (refreshError) {
          console.warn("Failed to refresh after renaming resume file:", refreshError);
        }
        showToast(`已重命名为“${nextName}”。`, "success");
      } catch (e) {
        console.error("Failed to rename resume file:", e);
        showDialog({
          title: "重命名失败",
          message: `无法重命名“${file.name}”：${e.message || "未知错误"}`,
          buttons: [{ text: "好的", primary: true }],
        });
      }
    },
  });
}

function setDirectoryImportBusy(isBusy) {

function setDirectoryImportStatus(message, level = "info") {

  if (!status) return;
  if (_directoryStatusTimer) {
    clearTimeout(_directoryStatusTimer);
    _directoryStatusTimer = null;
  }
  status.textContent = message;
  status.dataset.level = level;
  status.hidden = !message;
  if (level === "success") {
    _directoryStatusTimer = setTimeout(() => {
      status.hidden = true;
      _directoryStatusTimer = null;
    }, 5000);
  }
}

/**
 * Render collected resume files in the version panel.
 * @param {Array<{name:string, handle:{getFile:Function}}>} files
 * @param {string} directoryName
 * @param {boolean} canRefresh
 */
function renderResumeFileList(files, directoryName, canRefresh) {
  const list = document.getElementById("resume-list");
  const empty = document.getElementById("panel-empty");
  const dirName = document.getElementById("panel-dir-name");
  const btnRefresh = document.getElementById("btn-refresh-dir");

  _directoryFiles = files;
  _directoryName = directoryName;
  _directoryCanRefresh = canRefresh;

  if (dirName) {
    dirName.textContent = directoryName;
    dirName.title = directoryName;
  }
  if (btnRefresh) btnRefresh.hidden = !canRefresh;

  const pinned = loadPinnedResumes();
  const sortPinnedFirst = (getKey, fallback) => (a, b) => {
    const pinDifference = Number(pinned.has(getKey(b))) - Number(pinned.has(getKey(a)));
    return pinDifference || fallback(a, b);
  };
  const sourceFiles = [...files].sort(sortPinnedFirst(
    (file) => getResumePinKey("source", file.name),
    (a, b) => a.name.localeCompare(b.name, "zh-CN")
  ));
  const legacySnapshots = loadMarkdownSnapshots().sort((a, b) => (
    new Date(b.createdAt || 0) - new Date(a.createdAt || 0)
  ));
  if (list) {
    list.innerHTML = "";
    const appendHeading = (text) => {
      const heading = document.createElement("li");
      heading.className = "resume-list-heading";
      heading.textContent = text;
      list.appendChild(heading);
    };

    if (legacySnapshots.length > 0) appendHeading("旧版副本（打开后请另存为）");
    for (const snapshot of legacySnapshots) {
      const versionKey = `snapshot:${snapshot.id}`;
      const li = document.createElement("li");
      li.className = "resume-list-item resume-list-snapshot" + (versionKey === _activeFile ? " active" : "");
      li.title = snapshot.name;
      li.dataset.versionKey = versionKey;

      const label = document.createElement("span");
      label.textContent = snapshot.name.replace(/\.md$/i, "");
      li.appendChild(label);

      const deleteButton = document.createElement("button");
      deleteButton.className = "resume-list-action resume-list-delete";
      deleteButton.textContent = "×";
      deleteButton.title = "删除旧版副本";
      deleteButton.addEventListener("click", (event) => {
        event.stopPropagation();
        showDialog({
          title: "删除旧版副本",
          message: `确定删除“${snapshot.name}”吗？`,
          buttons: [
            { text: "取消" },
            { text: "删除", action: () => deleteMarkdownSnapshot(snapshot.id) },
          ],
        });
      });
      li.appendChild(deleteButton);

      const handle = {
        getFile: async () => new File([snapshot.markdown], snapshot.name, { type: "text/markdown" }),
      };
      li.addEventListener("click", () => loadResumeFromHandle(snapshot.name, handle, versionKey));
      list.appendChild(li);
    }

    if (sourceFiles.length > 0) appendHeading(directoryName === "当前文件" ? "当前文件" : "文件夹内的简历");
    for (const file of sourceFiles) {
      const { name, handle } = file;
      const displayName = file.entryName || name.split("/").pop() || name;
      const versionKey = `source:${name}`;
      const li = document.createElement("li");
      li.className = "resume-list-item resume-list-source" + (versionKey === _activeFile ? " active" : "");
      li.title = displayName;
      li.dataset.versionKey = versionKey;

      const label = document.createElement("span");
      label.textContent = displayName.replace(/\.(?:md|markdown|json)$/i, "");
      li.appendChild(label);

      const pinKey = getResumePinKey("source", name);
      const isPinned = pinned.has(pinKey);
      li.classList.toggle("pinned", isPinned);
      appendPinButton(li, pinKey, displayName, isPinned);

      if (file.parentDirectory && file.entryName) {
        const renameButton = document.createElement("button");
        renameButton.className = "resume-list-action resume-list-rename";
        renameButton.textContent = "✎";
        renameButton.title = "重命名文件";
        renameButton.setAttribute("aria-label", `重命名 ${displayName}`);
        renameButton.addEventListener("click", (event) => {
          event.stopPropagation();
          renameDirectoryResume(file);
        });
        li.appendChild(renameButton);

        const deleteButton = document.createElement("button");
        deleteButton.className = "resume-list-action resume-list-delete";
        deleteButton.textContent = "×";
        deleteButton.title = /\.json$/i.test(name) ? "删除 JSON 文件" : "删除 Markdown 文件";
        deleteButton.setAttribute("aria-label", `删除 ${displayName}`);
        deleteButton.addEventListener("click", (event) => {
          event.stopPropagation();
          confirmDeleteDirectoryResume(file);
        });
        li.appendChild(deleteButton);
      }

      li.addEventListener("click", () => loadResumeFromHandle(name, handle, versionKey, file));
      list.appendChild(li);
    }
  }

  if (empty) {
    const hasVersions = sourceFiles.length > 0 || legacySnapshots.length > 0;
    empty.textContent = hasVersions ? "" : "暂无导入文件";
    empty.classList.toggle("hidden", hasVersions);
  }
}

/**
 * Recursively collect Markdown and JSON candidates for resume validation.
 * @param {FileSystemDirectoryHandle} directory
 * @param {string} prefix
 * @param {Array<{name:string, handle:FileSystemFileHandle, parentDirectory:FileSystemDirectoryHandle, entryName:string}>} files
 */
async function collectResumeFiles(directory, prefix, files) {
  for await (const [name, handle] of directory.entries()) {
    if (name.startsWith(".")) continue;
    const relativeName = prefix ? `${prefix}/${name}` : name;
    if (handle.kind === "file" && /\.(?:md|markdown|json)$/i.test(name)) {
      files.push({ name: relativeName, handle, parentDirectory: directory, entryName: name });
    } else if (handle.kind === "directory") {
      await collectResumeFiles(handle, relativeName, files);
    }
  }
}

/**
 * Load a supported resume file from a FileSystemFileHandle.
 * @param {string} name
 * @param {FileSystemFileHandle} handle
 */
async function loadResumeFromHandle(name, handle, versionKey = name, sourceDescriptor = null) {
  // Warn if dirty
  if (isDirty()) {
    const confirmed = await new Promise((resolve) => {
      showDialog({
        title: "有未保存的修改",
        message: "切换简历将丢失当前未保存的修改，是否继续？",
        buttons: [
          { text: "取消",    action: () => resolve(false) },
          { text: "继续切换", primary: true, action: () => resolve(true) },
        ],
      });
    });
    if (!confirmed) return false;
  }

  try {
    const file = await handle.getFile();
    const text = await file.text();

    const isJson = /\.json$/i.test(name);
    const validation = isJson
      ? importJsonResume(text, name)
      : validateAndBuildState(parseMarkdown(text), name);

    if (validation.state) {
      const sourceFile = sourceDescriptor || _directoryFiles.find((item) => item.name === name);
      await hydrateReferencedPhoto(validation.state, sourceFile || { handle });
      setState(validation.state);
      renderResume(validation.state);
      updateA4Status();
      clearDirty();

      // Mark active
      _activeFile = versionKey;
      _activeSourceFile = sourceFile || { name, entryName: name.split("/").pop() || name, handle };
      document.querySelectorAll(".resume-list-item").forEach((li) => {
        li.classList.toggle("active", li.dataset.versionKey === versionKey);
      });
      return true;

    } else {
      const errs = validation.errors
        .filter((e) => e.level === "error")
        .map((e) => e.message)
        .join("\n");
      showDialog({ title: `${isJson ? "JSON" : "Markdown"} 导入失败`, message: errs, buttons: [{ text: "好的", primary: true }] });
      return false;
    }
  } catch (e) {
    console.error(e);
    const missing = e && (e.name === "NotFoundError" || /not found|不存在/i.test(e.message || ""));
    const denied = e && (e.name === "NotAllowedError" || e.name === "SecurityError");

    if (missing && _dirHandle) {
      try {
        await refreshResumeList();
      } catch (refreshError) {
        console.warn("Failed to refresh after missing file:", refreshError);
      }
    }

    showDialog({
      title: missing ? "文件已变化" : denied ? "需要重新授权" : "文件打开失败",
      message: missing
        ? `“${name}”已被移动、重命名或删除，右侧文件列表已刷新，请选择新的文件名。`
        : denied
          ? "浏览器已失去该目录的读取权限，请从顶部“打开”菜单重新选择文件夹。"
          : `无法打开“${name}”：${e.message || "未知错误"}`,
      buttons: [{ text: "好的", primary: true }],
    });
    return false;
  }
}

/** Load a photo declared in Markdown from the same private directory. */
async function hydrateReferencedPhoto(state, sourceFile) {
  const reference = String(state.photo && state.photo.source || "").trim();
  if (!reference) return;

  try {
    let photoFile = null;
    if (sourceFile && sourceFile.parentDirectory && !reference.includes("/")) {
      const photoHandle = await sourceFile.parentDirectory.getFileHandle(reference);
      photoFile = await photoHandle.getFile();
    } else if (sourceFile && sourceFile.relatedFiles) {
      const sourcePath = sourceFile.name || "";
      const basePath = sourcePath.includes("/") ? sourcePath.slice(0, sourcePath.lastIndexOf("/") + 1) : "";
      photoFile = sourceFile.relatedFiles.get(basePath + reference) || null;
    }
    if (!photoFile) throw new Error("请通过“打开文件夹”打开母版，以授权读取同目录照片。");
    const photo = await buildPhotoStateFromFile(photoFile, state.photo);
    photo.source = reference;
    state.photo = photo;
  } catch (error) {
    showToast(`未能自动载入照片“${reference}”：${error.message || "文件不可读"}`, "warning");
  }
}

/**
 * Initialize theme switcher.
 */
function initThemeSwitcher() {
  const btnA = document.getElementById("btn-theme-a");
  const btnB = document.getElementById("btn-theme-b");
  const btnC = document.getElementById("btn-theme-c");
  const btnD = document.getElementById("btn-theme-d");
